<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1d12">
<title>Crusaders</title>
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #2b1d12;
  --parch: #f1e4c4;
  --parch2: #e6d3a6;
  --gold: #c9973c;
  --blood: #8e2a1c;
  --muted: #6e5638;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; color: var(--ink); background: #1c140c; font: 17px/1.4 "IM Fell English", Georgia, serif; }
body {
  min-height: 100%; display: flex; flex-direction: column;
  background: #1c140c url("../strand.jpg") center top / cover no-repeat fixed;
}
.top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); }
.top a.back { color: #fff; text-decoration: none; font-size: 28px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
.top img { width: 46px; height: 46px; border-radius: 10px; box-shadow: 0 3px 12px rgba(0,0,0,0.5); }
.top h1 { margin: 0; font: 400 30px "Pirata One", "Cinzel", serif; color: #f6ead0; letter-spacing: 0.04em; text-shadow: 0 2px 0 #3a2410, 0 3px 12px rgba(0,0,0,0.7); }
.lvl {
  margin: 4px 16px 0; align-self: flex-start; font: 600 12px "Cinzel", serif; letter-spacing: 0.14em; text-transform: uppercase;
  color: #f6ead0; background: rgba(43,29,18,0.72); border: 1px solid rgba(201,151,60,0.6); padding: 5px 10px; border-radius: 4px;
}
.spacer { flex: 1; min-height: 18vh; }
.motto {
  margin: 0 16px 10px; color: #fff8e6; font: italic 21px/1.25 "IM Fell English", serif; text-shadow: 0 2px 10px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.9);
}
.parch {
  margin: 0 12px 12px; margin-bottom: max(12px, env(safe-area-inset-bottom)); padding: 18px 16px 16px; border-radius: 6px;
  background: radial-gradient(120% 90% at 50% 0%, #f7ecd2 0%, var(--parch) 55%, var(--parch2) 100%);
  box-shadow: 0 10px 30px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(110,86,56,0.35), inset 0 0 40px rgba(150,110,50,0.25);
  display: flex; flex-direction: column; gap: 12px; position: relative;
}
.parch::before, .parch::after { content: ""; position: absolute; left: 10px; right: 10px; height: 1px; background: rgba(110,86,56,0.35); }
.parch::before { top: 6px; } .parch::after { bottom: 6px; }
.row { display: flex; align-items: center; gap: 10px; }
.label { font: 600 11px "Cinzel", serif; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; gap: 6px; flex: 1; }
.seg button {
  flex: 1; border: 1px solid rgba(110,86,56,0.45); background: rgba(255,250,235,0.6); color: var(--ink); border-radius: 6px; padding: 9px 6px;
  font: 600 15px "Cinzel", serif; cursor: pointer;
}
.seg button[aria-pressed=true] { background: var(--ink); color: var(--parch); border-color: var(--ink); }
.die {
  flex: 0 0 auto; width: 46px; height: 46px; border-radius: 10px; border: 1px solid rgba(110,86,56,0.5); background: rgba(255,250,235,0.7);
  font-size: 24px; cursor: pointer; display: grid; place-items: center; transition: transform 0.5s;
}
.die.spin { transform: rotate(360deg); }
.lock { flex: 0 0 auto; width: 36px; height: 46px; border: 0; background: transparent; font-size: 18px; cursor: pointer; opacity: 0.45; }
.lock[aria-pressed=true] { opacity: 1; }
.namebox { flex: 1; min-width: 0; }
.name { font: 800 30px/1.1 "Cinzel", serif; color: var(--ink); overflow-wrap: anywhere; }
.von { font: 600 22px/1.15 "Cinzel", serif; color: var(--blood); overflow-wrap: anywhere; }
.von small { display: block; font: italic 16px "IM Fell English", serif; color: var(--muted); margin-top: 2px; }
.full {
  text-align: center; font: italic 19px "IM Fell English", serif; color: var(--muted); border-top: 1px solid rgba(110,86,56,0.3); padding-top: 10px;
}
.full b { font: 800 22px "Cinzel", serif; color: var(--ink); font-style: normal; display: block; }
.big { display: flex; gap: 8px; }
.big button {
  flex: 1; border: 0; border-radius: 8px; padding: 14px 10px; font: 800 16px "Cinzel", serif; letter-spacing: 0.04em; cursor: pointer;
}
#rollAll { background: rgba(255,250,235,0.85); color: var(--ink); border: 1px solid rgba(110,86,56,0.5); }
#take { background: var(--blood); color: #fbefd6; box-shadow: 0 3px 0 #5a1a10; }
#note { margin: 0; font-size: 14px; color: var(--muted); text-align: center; min-height: 1.2em; }
/* the oath, once the name is taken */
#oath { position: fixed; inset: 0; background: rgba(20,12,6,0.72); display: grid; place-items: center; padding: 20px; z-index: 10; }
#oath .parch { margin: 0; max-width: 440px; text-align: center; gap: 14px; animation: rise 0.8s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes rise { from { transform: translateY(40px) scale(0.92); opacity: 0; } to { transform: none; opacity: 1; } }
.seal { width: 74px; height: 74px; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c0402c, #7a1d12 70%); color: #f6d9b8;
  display: grid; place-items: center; font: 800 26px "Cinzel", serif; box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 -4px 8px rgba(0,0,0,0.3); }
#oath h2 { margin: 0; font: 800 26px "Cinzel", serif; }
#oath p { margin: 0; font-size: 18px; }
#oath a, #oath button { display: block; text-decoration: none; text-align: center; border-radius: 8px; padding: 13px; font: 800 15px "Cinzel", serif; cursor: pointer; border: 0; }
#oath a { background: var(--blood); color: #fbefd6; }
#oath button { background: transparent; color: var(--muted); }
/* the shape you take */
#look { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: #1c140c url("../strand.jpg") center top / cover no-repeat; }
#lookStage { flex: 1; min-height: 40vh; touch-action: none; }
#lookStage canvas { width: 100%; height: 100%; display: block; }
#lookPanel { max-height: 54vh; overflow-y: auto; gap: 10px; }
#lookPanel::before, #lookPanel::after { display: none; }
.lookHead b { display: block; font: 800 22px "Cinzel", serif; }
.lookHead span { font-style: italic; color: var(--muted); font-size: 15px; }
.opt { display: flex; flex-direction: column; gap: 6px; }
.opt i { font-style: normal; color: var(--blood); text-transform: none; letter-spacing: 0; font-family: "IM Fell English", serif; font-size: 14px; }
.opt input[type=range] { width: 100%; accent-color: var(--blood); }
.sw { display: flex; flex-wrap: wrap; gap: 8px; }
.sw button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff8e6; box-shadow: 0 0 0 1px rgba(110,86,56,0.5); cursor: pointer; }
.sw button[aria-pressed=true] { box-shadow: 0 0 0 3px var(--blood); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid rgba(110,86,56,0.45); background: rgba(255,250,235,0.6); border-radius: 6px; padding: 7px 10px; font: 600 14px "Cinzel", serif; color: var(--ink); cursor: pointer; }
.chips button[aria-pressed=true] { background: var(--ink); color: var(--parch); }
#lookRand { background: rgba(255,250,235,0.85); color: var(--ink); border: 1px solid rgba(110,86,56,0.5); }
#lookOk { background: var(--blood); color: #fbefd6; box-shadow: 0 3px 0 #5a1a10; }
</style>
</head>
<body>
<div class="top">
  <a class="back" href="../" aria-label="Zurück">‹</a>
  <img src="../icon-192.png" alt="">
  <h1>Crusaders</h1>
</div>
<div class="lvl">Schiffbrüchig · Stufe 0</div>
<div class="spacer"></div>
<p class="motto">Gestrandet an fremden Gestaden.<br>Thy name shall be given unto thee.</p>

<section class="parch" id="ed">
  <div class="row">
    <span class="label" style="width:74px">Wesen</span>
    <div class="seg" id="sex">
      <button type="button" data-v="f">Frau</button>
      <button type="button" data-v="m">Mann</button>
    </div>
    <button type="button" class="die" id="dSex" aria-label="Geschlecht würfeln">🎲</button>
  </div>
  <div class="row">
    <div class="namebox"><div class="label">Name</div><div class="name" id="name">…</div></div>
    <button type="button" class="lock" id="lName" aria-pressed="false" aria-label="Namen festhalten">🔓</button>
    <button type="button" class="die" id="dName" aria-label="Namen würfeln">🎲</button>
  </div>
  <div class="row">
    <div class="namebox"><div class="label">Herkunft</div><div class="von" id="von">…</div></div>
    <button type="button" class="lock" id="lVon" aria-pressed="false" aria-label="Herkunft festhalten">🔓</button>
    <button type="button" class="die" id="dVon" aria-label="Herkunft würfeln">🎲</button>
  </div>
  <div class="full" id="full"></div>
  <div class="big">
    <button type="button" id="rollAll">🎲 Alles würfeln</button>
    <button type="button" id="take">Diesen Namen tragen</button>
  </div>
  <p id="note"></p>
</section>

<div id="oath" hidden>
  <section class="parch">
    <div class="seal" id="sealL">C</div>
    <h2 id="oathName"></h2>
    <p id="oathText"></p>
    <a href="#" id="toLook">Gestalt annehmen</a>
    <a href="../welt/" id="toWorld" hidden>In die Welt</a>
    <button type="button" id="again">Neu beginnen</button>
  </section>
</div>

<section id="look" hidden>
  <div id="lookStage"></div>
  <div class="parch" id="lookPanel">
    <div class="lookHead"><b id="lookName"></b><span>in Lumpen, wie das Meer dich ausgespuckt hat</span></div>
    <div class="opt"><span class="label">Haut</span><div class="sw" id="oSkin"></div></div>
    <div class="opt"><span class="label">Statur <i id="oBuildT"></i></span><input type="range" id="oBuild" min="0" max="1" step="0.01"></div>
    <div class="opt"><span class="label">Kraft <i id="oMusT"></i></span><input type="range" id="oMus" min="0" max="1" step="0.01"></div>
    <div class="opt"><span class="label">Größe <i id="oHT"></i></span><input type="range" id="oH" min="150" max="200" step="1"></div>
    <div class="opt"><span class="label">Haar</span><div class="chips" id="oHair"></div></div>
    <div class="opt"><span class="label">Haarfarbe</span><div class="sw" id="oHairC"></div></div>
    <div class="opt" id="oBeardRow"><span class="label">Bart</span><div class="chips" id="oBeard"></div></div>
    <div class="big"><button type="button" id="lookRand">🎲 Würfeln</button><button type="button" id="lookOk">In die Welt</button></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../avatar.js"></script>
<script src="../kampf.js"></script>
<script>

const $ = (s) => document.querySelector(s);

/* ---------------- Names of the old world ----------------

const NAMES = {

    "Tomoe", "Murasaki", "Shizuka", "Kaguya", "Meilin", "Xiu", "Lian", "Ixchel", "Xochitl", "Citlali", "Nicte", "Killa", "Ocllo", "Makeda", "Nzinga", "Yaa",
    "Amina", "Taytu", "Mechthild", "Hildegard", "Kunigunde", "Walburga", "Irmgard", "Gisela", "Rotraut", "Ermengarde", "Hedwig", "Kriemhild", "Gesche", "Alruna",
    "Saphira", "Vesna", "Ilona", "Esmeralda", "Catalina", "Oriane", "Mélusine", "Yseult", "Aurelia", "Livia", "Octavia", "Valeria", "Cornelia", "Severina"],
  m: ["Aydin", "Balduin", "Tankred", "Bohemund", "Gottfried", "Raimund", "Amaury", "Rainald", "Ulrich", "Lothar", "Wolfram", "Walther", "Gunther", "Hagen",
    "Dietrich", "Sigurd", "Ragnar", "Leif", "Harald", "Thorvald", "Egil", "Halvard", "Ivar", "Alexios", "Manuel", "Andronikos", "Nikephoros", "Basileios",
    "Theodoros", "Isaakios", "Leonidas", "Kimon", "Lysander", "Aristides", "Diomedes", "Ikaros", "Orestes", "Telamon", "Xanthos", "Dareios", "Kyros", "Rostam",
    "Bahram", "Ardaschir", "Kaveh", "Farhad", "Tariq", "Harun", "Yusuf", "Khalil", "Zaid", "Rashid", "Idris", "Malik", "Timur", "Orhan", "Alp", "Tuğrul",
    "Baybars", "Cormac", "Fergus", "Bran", "Tristan", "Gawain", "Parzival", "Owain", "Cadoc", "Brennus", "Rodrigo", "Sancho", "Íñigo", "Álvar", "Pelayo",
    "Fernán", "Marco", "Enrico", "Cosimo", "Lorenzo", "Guido", "Rinaldo", "Vlad", "Mircea", "Swjatoslaw", "Jaromír", "Bolesław", "Kasimir", "Dobromir",
    "Vratislav", "Musashi", "Yoshitsune", "Kenshin", "Temüdschin", "Batu", "Subutai", "Jayavarman", "Ashoka", "Rajendra", "Vikram", "Cuauhtémoc", "Tupac",
    "Manco", "Pachacútec", "Itzamná", "Sundiata", "Ezana", "Askia", "Kankan", "Thorgrim", "Valerius", "Belisar", "Aurelian", "Cassian", "Varro", "Drusus",
    "Corvinus", "Hakon", "Eirik", "Ansgar", "Eberhard", "Konradin", "Manfred", "Ottokar", "Wenzel", "Mathias", "Jakobus", "Lazar", "Stefan Dušan", "Kalojan"],
};
// [place, land]: the old places and the regions travel still dreams of
const ORIGINS = [
  ["Salvia", "Latium"], ["Salach", "Schwaben"], ["Medina", "Hedschas"], ["Lindos", "Rhodos"], ["Kamiros", "Rhodos"], ["Athos", "Chalkidike"], ["Jericho", "Levante"],
  ["Kelheim", "Bayern"], ["Akkon", "Levante"], ["Tyros", "Levante"], ["Byblos", "Levante"], ["Antiochia", "Levante"], ["Damaskus", "Levante"], ["Petra", "Nabatäa"],
  ["Hermannstadt", "Siebenbürgen"], ["Schäßburg", "Siebenbürgen"], ["Kronstadt", "Siebenbürgen"], ["Hall", "Tirol"], ["Rattenberg", "Tirol"], ["Brixen", "Tirol"],
  ["Lübeck", "der Hanse"], ["Visby", "Gotland"], ["Stralsund", "der Hanse"], ["Brügge", "Flandern"], ["Bergen", "Norwegen"], ["Reval", "Livland"], ["Riga", "Livland"],
  ["Siena", "Toskana"], ["Lucca", "Toskana"], ["San Gimignano", "Toskana"], ["Arles", "der Provence"], ["Avignon", "der Provence"], ["Granada", "Andalusien"],
  ["Córdoba", "Andalusien"], ["Ronda", "Andalusien"], ["Fès", "dem Maghreb"], ["Marrakesch", "dem Maghreb"], ["Chefchaouen", "dem Rif"], ["Ephesos", "Ionien"],
  ["Smyrna", "Ionien"], ["Konya", "Anatolien"], ["Göreme", "Kappadokien"], ["Myra", "Lykien"], ["Naxos", "den Kykladen"], ["Thera", "den Kykladen"], ["Patmos", "der Ägäis"],
  ["Knossos", "Kreta"], ["Chania", "Kreta"], ["Krumau", "Böhmen"], ["Kuttenberg", "Böhmen"], ["Beaune", "Burgund"], ["Carnac", "der Bretagne"], ["Saint-Malo", "der Bretagne"],
  ["Tintagel", "Cornwall"], ["Dunvegan", "Skye"], ["Stirling", "Schottland"], ["Harlech", "Wales"], ["Thingvellir", "Island"], ["Isfahan", "Persien"], ["Schiras", "Persien"],
  ["Yazd", "Persien"], ["Samarkand", "der Seidenstraße"], ["Buchara", "der Seidenstraße"], ["Chiwa", "Choresmien"], ["Jaipur", "Radschputana"], ["Hampi", "Vijayanagara"],
  ["Goa", "Malabar"], ["Galle", "Ceylon"], ["Kandy", "Ceylon"], ["Ayutthaya", "Siam"], ["Sukhothai", "Siam"], ["Angkor", "Kambuja"], ["Nara", "Yamato"], ["Kamakura", "Sagami"],
  ["Kyōto", "Yamashiro"], ["Dunhuang", "Gansu"], ["Lijiang", "Yunnan"], ["Chang'an", "dem Reich der Mitte"], ["Yogyakarta", "Java"], ["Sanaa", "Jemen"], ["Muskat", "Oman"],
  ["Theben", "Oberägypten"], ["Alexandria", "Ägypten"], ["Assuan", "Nubien"], ["Meroë", "Kusch"], ["Lalibela", "Abessinien"], ["Aksum", "Abessinien"], ["Lamu", "der Swahiliküste"],
  ["Sansibar", "der Swahiliküste"], ["Kilwa", "der Swahiliküste"], ["Timbuktu", "Mali"], ["Djenné", "Mali"], ["Cusco", "Tawantinsuyu"], ["Ollantaytambo", "dem Heiligen Tal"],
  ["Potosí", "Charcas"], ["Tenochtitlan", "Anáhuac"], ["Oaxaca", "Mixtekenland"], ["Palenque", "Chiapas"], ["Uxmal", "Yucatán"], ["Cartagena", "Neugranada"],
  ["Havanna", "Kuba"], ["Nantucket", "Neuengland"], ["Ouro Preto", "Minas Gerais"], ["Olinda", "Pernambuco"], ["Tiflis", "Georgien"], ["Mzcheta", "Iberien"], ["Ani", "Armenien"],
  ["Nowgorod", "der Rus"], ["Susdal", "der Rus"], ["Krakau", "Kleinpolen"], ["Thorn", "Preußen"], ["Gran", "Ungarn"], ["Ragusa", "Dalmatien"], ["Spalato", "Dalmatien"],
  ["Zara", "Dalmatien"], ["Syrakus", "Sizilien"], ["Cefalù", "Sizilien"], ["Mdina", "Malta"], ["Famagusta", "Zypern"], ["Kyrenia", "Zypern"], ["Sintra", "Portugal"],
  ["Évora", "Alentejo"], ["Toledo", "Kastilien"], ["Ávila", "Kastilien"], ["Segovia", "Kastilien"], ["Colmar", "dem Elsass"], ["Rappoltsweiler", "dem Elsass"],
  ["Esslingen", "Schwaben"], ["Hohenstaufen", "Schwaben"], ["Rothenburg", "Franken"], ["Dinkelsbühl", "Franken"], ["Landshut", "Bayern"], ["Bacharach", "dem Rheinland"],
  ["Oberwesel", "dem Rheinland"], ["Gent", "Flandern"], ["Hindeloopen", "Friesland"], ["Torcello", "der Lagune"], ["Murano", "der Lagune"], ["Portofino", "Ligurien"],
  ["Ravello", "Amalfi"], ["Otranto", "Apulien"], ["Trani", "Apulien"], ["Monemvasia", "Morea"], ["Mystras", "Morea"], ["Nauplia", "Morea"], ["Meteora", "Thessalien"],
  ["Åbo", "Finnland"], ["Englaland", "der Insel der Angeln"], ["Kalkutta", "Bengalen"], ["Malakka", "der Meerenge"], ["Hoi An", "Champa"], ["Bagan", "Pagan"],
  ["Kathmandu", "dem Himalaya"], ["Lhasa", "Tibet"], ["Karakorum", "der Steppe"], ["Kaschgar", "der Seidenstraße"], ["Palmyra", "der Wüste"], ["Ur", "Sumer"], ["Babylon", "Mesopotamien"],
];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
// "Englaland": already a land; the rest reads "von Medina · Hedschas"
const vonText = (o) => o[0];

/* ---------------- Who is already taken ----------------
   Every combination of name and origin exists only once. Taken ones are kept here; if a shared
   register is configured (CRUSADERS_REGISTER), it decides for everyone. */
const TAKEN_KEY = "crusaders-vergeben", ME_KEY = "crusaders-ich";
let taken = new Set(); try { taken = new Set(JSON.parse(localStorage.getItem(TAKEN_KEY) || "[]")); } catch (e) {}
const seen = new Set();          // not shown twice while rolling
const keyOf = (c) => c.name + "|" + c.von[0];
const total = () => NAMES.f.length * ORIGINS.length + NAMES.m.length * ORIGINS.length;

let C = { sex: Math.random() < 0.5 ? "f" : "m", name: "", von: ORIGINS[0] };
const locks = { name: false, von: false };
function free(c) { const k = keyOf(c); return !taken.has(k) && !seen.has(k); }
function roll(what) {
  for (let i = 0; i < 400; i++) {
    const c = { ...C };
    if (what.sex) c.sex = Math.random() < 0.5 ? "f" : "m";
    if (what.name || what.sex) c.name = locks.name && !what.sex ? C.name : pick(NAMES[c.sex]);
    if (what.von) c.von = locks.von ? C.von : pick(ORIGINS);
    if (free(c)) { C = c; seen.add(keyOf(c)); return true; }
  }
  return false;
}
function show(animate) {
  $("#sex").querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === C.sex)));
  const fin = () => {
    $("#name").textContent = C.name;
    $("#von").innerHTML = "von " + vonText(C.von) + `<small>${C.von[1]}</small>`;
    $("#full").innerHTML = `Man nennt ${C.sex === "f" ? "sie" : "ihn"}<b>${C.name} von ${vonText(C.von)}</b>`;
  };
  if (!animate) return fin();
  // a short shuffle, like dice rolling
  let n = 0; const tm = setInterval(() => {
    if (animate.name) $("#name").textContent = pick(NAMES[C.sex]);
    if (animate.von) { const o = pick(ORIGINS); $("#von").innerHTML = "von " + o[0] + `<small>${o[1]}</small>`; }
    if (++n >= 9) { clearInterval(tm); fin(); }
  }, 55);
}
function spin(id) { const d = $(id); d.classList.remove("spin"); void d.offsetWidth; d.classList.add("spin"); }
function act(what, die) {
  if (die) spin(die);
  if (!roll(what)) { $("#note").textContent = "Alles schon vergeben, was hier passt. Löse ein Schloss."; return; }
  $("#note").textContent = "";
  show({ name: what.name || what.sex, von: what.von });
}
$("#dSex").onclick = () => act({ sex: true }, "#dSex");
$("#dName").onclick = () => { if (locks.name) toggleLock("name"); act({ name: true }, "#dName"); };
$("#dVon").onclick = () => { if (locks.von) toggleLock("von"); act({ von: true }, "#dVon"); };
$("#rollAll").onclick = () => act({ sex: !locks.name, name: true, von: true });
$("#sex").querySelectorAll("button").forEach((b) => b.onclick = () => { if (C.sex === b.dataset.v) return; C.sex = b.dataset.v; if (locks.name) toggleLock("name"); act({ name: true }); });
function toggleLock(k) {
  locks[k] = !locks[k];
  const b = $(k === "name" ? "#lName" : "#lVon"); b.setAttribute("aria-pressed", String(locks[k])); b.textContent = locks[k] ? "🔒" : "🔓";
}
$("#lName").onclick = () => toggleLock("name");
$("#lVon").onclick = () => toggleLock("von");

/* ---------------- Taking the name ---------------- */
async function claim(c) {
  const R = window.CRUSADERS_REGISTER;   // { url, key } of a shared register; without it, this phone decides
  if (R) {
    try {
      const r = await fetch(R.url + "/rest/v1/crusaders_names", { method: "POST", headers: { apikey: R.key, Authorization: "Bearer " + R.key, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify({ name: c.name, origin: c.von[0], sex: c.sex }) });
      if (r.status === 409) return false;
      if (!r.ok) throw new Error(r.status);
    } catch (e) { $("#note").textContent = "Das Register antwortet nicht. Versuch es gleich noch einmal."; return null; }
  }
  return true;
}
$("#take").onclick = async () => {
  if (taken.has(keyOf(C))) { $("#note").textContent = "Dieser Name ist schon vergeben."; return; }
  const ok = await claim(C);
  if (ok === null) return;
  taken.add(keyOf(C)); try { localStorage.setItem(TAKEN_KEY, JSON.stringify([...taken])); } catch (e) {}
  if (!ok) { $("#note").textContent = "Diesen Namen trägt schon jemand. Würfle weiter."; act({ name: true, von: true }); return; }
  const me = { ...C, id: Date.now().toString(36), since: new Date().toISOString(), level: 0, title: "Schiffbrüchig" };
  try { localStorage.setItem(ME_KEY, JSON.stringify(me)); } catch (e) {}
  window.Spiel.saveHero(me);      // joins your roster of characters
  showOath(me);
};
function showOath(me) {
  $("#sealL").textContent = me.name[0];
  $("#oathName").textContent = me.name + " von " + me.von[0];
  $("#oathText").innerHTML = `Gestrandet an fremden Gestaden, erhebst du dich aus dem Sand${me.von[1] ? ", " + (me.sex === "f" ? "Tochter" : "Sohn") + " aus " + me.von[1] : ""}.<br><br>Schiffbrüchig, Stufe 0. Dein Weg beginnt hier.`;
  $("#oath").hidden = false;
  $("#toLook").textContent = me.look ? "Gestalt ändern" : "Gestalt annehmen";
  $("#toWorld").hidden = !me.look;
}

/* ---------------- The shape you take ---------------- */
const AV = window.CrusaderAvatar;
let LK = null, lookR = null, lookScene, lookCam, lookFig = null, lookYaw = 0.3;
function lookInit() {
  if (lookR) return;
  lookR = new THREE.WebGLRenderer({ antialias: true, alpha: true }); lookR.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  $("#lookStage").append(lookR.domElement);
  lookScene = new THREE.Scene();
  lookCam = new THREE.PerspectiveCamera(30, 1, 0.1, 50); lookCam.position.set(0, 1.1, 4.2); lookCam.lookAt(0, 0.95, 0);
  lookScene.add(new THREE.HemisphereLight(0xfff6e6, 0x5a4a38, 0.6));
  const sun = new THREE.DirectionalLight(0xfff0d8, 0.9); sun.position.set(-2, 4, 3); lookScene.add(sun);
  const sh = new THREE.Mesh(new THREE.CircleGeometry(0.45, 20), new THREE.MeshBasicMaterial({ color: 0x3a2a18, transparent: true, opacity: 0.45 }));
  sh.rotation.x = -Math.PI / 2; sh.scale.set(1.3, 0.8, 1); lookScene.add(sh);
  let dragX = null; const st = $("#lookStage");
  st.addEventListener("pointerdown", (e) => { dragX = e.clientX; st.setPointerCapture(e.pointerId); });
  st.addEventListener("pointermove", (e) => { if (dragX != null) { lookYaw += (e.clientX - dragX) * 0.01; dragX = e.clientX; } });
  st.addEventListener("pointerup", () => { dragX = null; });
  let last = performance.now();
  const loop = (now) => {
    if ($("#look").hidden) { requestAnimationFrame(loop); return; }
    const r = $("#lookStage").getBoundingClientRect();
    if (lookR.domElement.width !== Math.round(r.width * lookR.getPixelRatio())) { lookR.setSize(r.width, r.height, false); lookCam.aspect = r.width / r.height; lookCam.updateProjectionMatrix(); }
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (lookFig) { lookFig.root.rotation.y = lookYaw; lookFig.update(dt, 0); }
    lookR.render(lookScene, lookCam); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function lookBuild() {
  if (lookFig) lookScene.remove(lookFig.root);
  lookFig = AV.build(THREE, LK); lookScene.add(lookFig.root);
}
const BUILD_T = (v) => ["hager", "schlank", "kräftig", "breit", "rund"][Math.min(4, Math.floor(v * 5))];
const MUS_T = (v) => ["schwach", "zäh", "kräftig", "stark"][Math.min(3, Math.floor(v * 4))];
function lookPanel() {
  const sw = (id, list, key) => { $(id).innerHTML = list.map((c, i) => `<button type="button" style="background:${c}" data-i="${i}" aria-pressed="${LK[key] === i}"></button>`).join("");
    $(id).querySelectorAll("button").forEach((b) => b.onclick = () => { LK[key] = +b.dataset.i; lookChanged(); }); };
  const chips = (id, list, key) => { $(id).innerHTML = list.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${LK[key] === v}">${t}</button>`).join("");
    $(id).querySelectorAll("button").forEach((b) => b.onclick = () => { LK[key] = b.dataset.v; lookChanged(); }); };
  sw("#oSkin", AV.SKIN, "skin"); sw("#oHairC", AV.HAIRC, "hairC");
  chips("#oHair", AV.HAIR[LK.sex], "hair"); chips("#oBeard", AV.BEARD, "beard");
  $("#oBeardRow").hidden = LK.sex === "f";
  $("#oBuild").value = LK.build; $("#oBuildT").textContent = BUILD_T(LK.build);
  $("#oMus").value = LK.muscle; $("#oMusT").textContent = MUS_T(LK.muscle);
  $("#oH").value = LK.height; $("#oHT").textContent = LK.height + " cm";
}
function lookChanged() { lookPanel(); lookBuild(); }
for (const [id, key] of [["#oBuild", "build"], ["#oMus", "muscle"], ["#oH", "height"]]) $(id).oninput = (e) => { LK[key] = +e.target.value; lookChanged(); };
$("#lookRand").onclick = () => {
  const r = (a) => a[Math.floor(Math.random() * a.length)];
  Object.assign(LK, { skin: Math.floor(Math.random() * AV.SKIN.length), hairC: Math.floor(Math.random() * AV.HAIRC.length), build: Math.random(), muscle: Math.random(),
    height: Math.round((LK.sex === "f" ? 158 : 168) + Math.random() * 24), hair: r(AV.HAIR[LK.sex])[0], beard: r(AV.BEARD)[0] });
  lookChanged();
};
$("#toLook").onclick = (e) => {
  e.preventDefault();
  const me = JSON.parse(localStorage.getItem(ME_KEY));
  LK = { ...AV.defaults(me.sex), ...(me.look || {}), sex: me.sex };
  $("#lookName").textContent = me.name + " von " + me.von[0];
  $("#oath").hidden = true; $("#look").hidden = false;
  lookInit(); lookPanel(); lookBuild();
};
$("#lookOk").onclick = () => {
  const me = JSON.parse(localStorage.getItem(ME_KEY)); me.look = { ...LK };
  try { localStorage.setItem(ME_KEY, JSON.stringify(me)); } catch (e) {}
  window.Spiel.saveHero(me);
  location.href = "../welt/";
};
$("#again").onclick = () => {
  if (!confirm("Wirklich neu beginnen? Dein Name bleibt vergeben.")) return;
  try { localStorage.removeItem(ME_KEY); } catch (e) {}
  $("#oath").hidden = true; act({ sex: true, name: true, von: true });
};

let me = null; try { me = JSON.parse(localStorage.getItem(ME_KEY) || "null"); } catch (e) {}
window.Spiel.heroes();                                        // an old character joins the roster
if (new URLSearchParams(location.search).has("neu")) me = null;   // a new character, from the menu
if (me) { C = { sex: me.sex, name: me.name, von: me.von }; show(); showOath(me); }
else { roll({ sex: true, name: true, von: true }); show(); }
console.log("Mögliche Namen:", total());
</script>
