<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>Crusaders</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Figtree:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root { --slate: #1b1f2a; --panel: #262c3a; --rim: #8d929c; --gold: #e2b04a; --txt: #f3ead6; --dim: #9aa0ac; --red: #b8322a; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #120d0a; color: var(--txt); font: 16px/1.35 "Figtree", sans-serif; }
/* the painting behind, turned into big pixels */
#bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; filter: brightness(0.55) saturate(0.8); }
.frame { position: relative; background: linear-gradient(#2e3546, #1f2430); border: 3px solid var(--rim); box-shadow: inset 0 0 0 2px #3c4252, 0 0 0 2px #14171f, 0 6px 16px rgba(0,0,0,0.5); border-radius: 6px; }
.frame::before, .frame::after { content: "✠"; position: absolute; top: 50%; transform: translateY(-50%); color: var(--rim); font-size: 14px; }
.frame::before { left: 6px; } .frame::after { right: 6px; }
header.top { position: fixed; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top)); text-align: center; padding: 8px 26px; }
header.top h1 { margin: 0; font: 700 30px "Pixelify Sans", monospace; letter-spacing: 0.08em; text-shadow: 0 3px 0 #000; }
/* the rings */
#rings { position: fixed; left: 0; right: 0; top: 0; bottom: 0; }
#rings svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--txt); -webkit-tap-highlight-color: transparent; }
.ring .disc { width: var(--s); height: var(--s); border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle, #3a3f4a 0 55%, #23272f 56% 60%, var(--rc, #8d929c) 61% 66%, #1a1d24 67% 70%, var(--rc, #8d929c) 71% 74%, transparent 75%);
  box-shadow: 0 6px 14px rgba(0,0,0,0.55); transition: transform 0.15s; }
.ring:active .disc { transform: scale(0.94); }
.ring canvas { width: 62%; height: 62%; image-rendering: pixelated; }
.ring b, .ring small { position: relative; z-index: 2; }
.ring b { font: 700 var(--fs, 22px) "Pixelify Sans", monospace; letter-spacing: 0.04em; text-shadow: 0 2px 0 #000, 0 0 6px #000; margin-top: -14px; }
.ring small { font: 600 12px "Pixelify Sans", monospace; color: var(--gold); text-shadow: 0 1px 0 #000; }
/* bottom bar */
footer.bar { position: fixed; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 10px; padding: 8px 26px; }
footer .who { flex: 1; min-width: 0; font: 700 16px "Pixelify Sans", monospace; }
footer .who div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
footer .exp { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #c9e06a; }
footer .exp i { flex: 1; height: 9px; border: 2px solid var(--rim); border-radius: 6px; background: #12151d; overflow: hidden; display: block; max-width: 160px; }
footer .exp i span { display: block; height: 100%; background: linear-gradient(90deg, #e2541a, #ffb030); }
footer a, footer button { font: 700 17px "Pixelify Sans", monospace; color: var(--txt); text-decoration: none; background: none; border: 0; cursor: pointer; white-space: nowrap; }
#devBtn { color: #ffd76a; font-size: 14px; border: 2px solid #ffd76a; border-radius: 6px; padding: 3px 6px; }
/* sheets */
.msheet { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: rgba(10,8,6,0.6); }
.msheet .frame { margin: auto 8px max(8px, env(safe-area-inset-bottom)); max-height: calc(100% - 70px); display: flex; flex-direction: column; padding: 0; }
.msheet .frame::before, .msheet .frame::after { display: none; }
.msheet h2 { margin: 0; padding: 12px 14px 8px; font: 700 22px "Pixelify Sans", monospace; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid #3c4252; }
.msheet h2 span { flex: 1; }
.msheet h2 button { font: 700 16px "Pixelify Sans", monospace; color: var(--txt); background: #3a4152; border: 2px solid var(--rim); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
.msheet .in { overflow: auto; padding: 12px 14px 18px; }
.msheet p.note { color: var(--dim); margin: 2px 0 12px; font-size: 14px; }
.btn { font: 700 16px "Pixelify Sans", monospace; padding: 9px 14px; border-radius: 7px; border: 2px solid #e6b44a; background: linear-gradient(#c9963c, #8a5a1c); color: #fff6dc; cursor: pointer; }
.btn.ghost { border-color: var(--rim); background: #3a4152; }
.btn:disabled { filter: grayscale(1); opacity: 0.5; }
.hero { display: flex; align-items: center; gap: 10px; padding: 10px; border: 2px solid #3c4252; border-radius: 8px; margin-bottom: 8px; background: rgba(0,0,0,0.15); }
.hero.on { border-color: var(--gold); background: rgba(226,176,74,0.1); }
.hero .ic { font-size: 26px; width: 34px; text-align: center; }
.hero .t { flex: 1; min-width: 0; }
.hero b { font: 700 17px "Pixelify Sans", monospace; display: block; }
.hero small { color: var(--dim); }
.hero .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hero .btn { font-size: 14px; padding: 6px 10px; }
/* fasting */
.clock { text-align: center; margin: 6px 0 12px; }
.clock b { display: block; font: 700 46px "Pixelify Sans", monospace; color: var(--gold); letter-spacing: 0.04em; }
.clock small { color: var(--dim); }
.stages { display: grid; gap: 6px; margin: 10px 0; }
.stage { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; background: rgba(0,0,0,0.18); border: 2px solid #3c4252; font-size: 14px; }
.stage.got { border-color: #6aa84a; background: rgba(106,168,74,0.12); }
.stage .h { font: 700 18px "Pixelify Sans", monospace; width: 44px; }
.stage .n { flex: 1; } .stage .n b { display: block; font: 600 15px "Figtree", sans-serif; }
.stage .r { color: var(--gold); font: 600 13px "Pixelify Sans", monospace; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.chips button { font: 600 14px "Pixelify Sans", monospace; color: var(--txt); background: #3a4152; border: 2px solid #3c4252; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.chips button[aria-pressed=true] { border-color: var(--gold); color: var(--gold); }
/* the codex tree */
.br { margin-bottom: 16px; }
.br > .head { display: flex; align-items: center; gap: 10px; }
.br > .head .orb { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: radial-gradient(circle, #3a3f4a 0 60%, var(--gold) 61% 68%, #1a1d24 69%); flex: 0 0 auto; }
.br > .head b { font: 700 19px "Pixelify Sans", monospace; display: block; }
.br > .head small { color: var(--dim); }
.br > .head .btn { margin-left: auto; font-size: 13px; padding: 6px 9px; }
.tree { list-style: none; margin: 4px 0 0 21px; padding: 0 0 0 16px; border-left: 2px solid #4a5062; }
.tree li { position: relative; padding: 4px 0; }
.tree li::before { content: ""; position: absolute; left: -16px; top: 15px; width: 12px; border-top: 2px solid #4a5062; }
.node { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--dim); }
.node i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #4a5062; display: grid; place-items: center; font-style: normal; font-size: 11px; flex: 0 0 auto; }
.node.got { color: var(--txt); } .node.got i { background: var(--gold); border-color: #fff2a8; color: #2b1d12; }
.node.part i { border-color: var(--gold); }
.node em { font-style: normal; color: var(--gold); font: 600 12px "Pixelify Sans", monospace; }
details > summary { cursor: pointer; list-style: none; } details > summary::-webkit-details-marker { display: none; }
details > summary .node::after { content: " ▸"; color: var(--dim); } details[open] > summary .node::after { content: " ▾"; }
.dev label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #3c4252; font-size: 15px; }
.dev label small { display: block; color: var(--dim); }
#toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 30; max-width: 92%; background: #2e3546; border: 2px solid var(--gold); border-radius: 8px; padding: 8px 14px; font: 600 15px "Pixelify Sans", monospace; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
#pcBtn { display: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="rings"><svg id="links"></svg></div>
<header class="top frame"><h1>CRUSADERS</h1></header>
<footer class="bar frame">
  <div class="who"><div id="who">SPIELER: …</div><div class="exp">EXP <i><span id="expBar"></span></i> <span id="lvl"></span></div></div>
  <button type="button" id="devBtn" hidden>✨ DEV</button>
  <a href="/">☛ ZURÜCK</a>
</footer>

<div class="msheet" id="sh" hidden><div class="frame"><h2><span id="shT"></span><button type="button" id="shX">✕</button></h2><div class="in" id="shIn"></div></div></div>
<div id="toast" hidden></div>
<button type="button" id="pcBtn">✉</button>

<script src="kampf.js"></script>
<script src="postcards.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const toast = (t, ms = 3500) => { const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.tm); toast.tm = setTimeout(() => { e.hidden = true; }, ms); };
const S = window.Spiel;
const fmt = (n) => String(n).replace(".", ",");

/* ---------------- Background: the camp painting, in big pixels ---------------- */
function paintBg() {
  const cv = $("#bg"), W = 110, H = Math.round((W * innerHeight) / innerWidth); cv.width = W; cv.height = H;
  const img = new Image(); img.src = "bilder/" + (S.get().camp >= 2 ? "lager-geraeumt" : "lager-wrack") + ".jpg";
  img.onload = () => { const c = cv.getContext("2d"), k = Math.max(W / img.width, H / img.height), w = img.width * k, h = img.height * k; c.drawImage(img, (W - w) / 2, (H - h) * 0.55, w, h); };
}

/* ---------------- Pixel icons for the rings ---------------- */
const ICON = {
  ritter: { pal: { k: "#14100c", m: "#c9ced6", M: "#8d939c", d: "#5a606a", r: "#b8322a", w: "#f2ede2", b: "#7a5230", y: "#e2b04a" }, rows: [
    "......kkkkk.......", ".....kmmmmmk......", "....kmmmmmmmk.....", "....kmMkkkMmk.....", "....kmMkkkMmk.....", "....kmmmrmmmk.....",
    "....kMmmrmmMk.....", ".....kMMMMMk......", "...kkwwwwwwwkk....", "..kwwwwrrwwwwwk...", "..kwwwrrrrwwwwk...", "..kmwwwrrwwwwmk...",
    "..kmwwwrrwwwwmkk..", "..kmwwwwwwwwwmkyk.", "..kkwwwwwwwwwkkyk.", "....kwwwwwwwk.kk..", "....kwwwkwwwk.....", "....kdddkdddk.....",
    "....kmmk.kmmk.....", "....kmmk.kmmk.....", "...kbbbk.kbbbk....", "...kkkkk.kkkkk...."] },
  mensa: { pal: { k: "#14100c", w: "#f2ede2", g: "#c9ced6", b: "#8a5a32", B: "#5a3a20", f: "#e8d8a8", c: "#c9803a", C: "#9a5a22", r: "#d84a2a", v: "#6aa84a", y: "#f2c84a" }, rows: [
    "...........kkkk...", "..........kBbbBk..", "..........kwwwwk..", "..........kbBbbkk.", "..........kbbbbk.k", "..........kbbBbkk.",
    "..........kbbbbk..", "..........kkkkkk..", "....kkkkkkkk......", "..kkwwwwwwwwkk....", ".kwwvvrrwwccccwk..", "kwwvvrrryyccCCcwk.",
    "kwwvvrryyycCCccwk.", "kwwwvvryyyyccc.wk.", ".kwwwwwwwwwwwwwk..", "..kkwwwwwwwwwkk...", "....kkkkkkkkk.....", "................."] },
  buch: { pal: { k: "#14100c", p: "#f3e6c6", P: "#d8c49a", r: "#7a1a2a", l: "#6a4a8a", q: "#e8dcc0", Q: "#a8946a" }, rows: [
    "..............kq..", ".............kqQk.", "............kqQk..", "...........kqQk...", ".kkkkkk...kkQkkk..", "kppppppkkkpppppppk",
    "kplpllpkpkPppppppk", "kppppppkpkpllplppk", "kpllplpkpkPppppppk", "kppppppkpkpplpllpk", "kplplppkpkPppppppk", "kppppppkpkpllpllpk",
    "kpllpppkpkPppppppk", "kkkkkkkkkkkkkkkkkk", "krrrrrrrrrrrrrrrrk", ".kkkkkkkkkkkkkkkk."] },
  zelt: { pal: { k: "#14100c", w: "#e8dcc0", W: "#bdb39a", b: "#5a3a20", o: "#e2541a", y: "#ffb030", r: "#b8322a" }, rows: [
    "........r.......", "........rr......", "........b.......", ".......kwk......", "......kwWwk.....", ".....kwwWwwk....", "....kwwwWwwwk...",
    "...kwwwkbkwwwk..", "..kwwwwkbkwwwwk.", ".kwwwwwkbkwwwwwk", "kkkkkkkkkkkkkkkk", "......kyk.......", ".....koyok......", "....kbbbbbk....."] },
};
function drawIcon(cv, ic) {
  const rows = ic.rows, W = Math.max(...rows.map((r) => r.length)), H = rows.length, c = cv.getContext("2d");
  cv.width = W; cv.height = H;
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const ch = row[i]; if (ch === "." || !ic.pal[ch]) continue; c.fillStyle = ic.pal[ch]; c.fillRect(i, j, 1, 1); } });
}
// the globe: drawn, not written; a rough earth with Europe and Africa facing you
function drawGlobe(cv) {
  const R = 15, N = 32, c = cv.getContext("2d"); cv.width = N; cv.height = N;
  const land = (u, v) => {     // u: -1..1 east, v: -1..1 south, a few blobs for the Old World
    const b = [[-0.05, -0.45, 0.32, 0.22], [0.05, 0.25, 0.3, 0.42], [0.55, -0.35, 0.5, 0.3], [0.62, 0.1, 0.18, 0.18], [-0.75, -0.2, 0.22, 0.4], [-0.8, 0.45, 0.16, 0.3], [0.35, -0.1, 0.1, 0.1]];
    return b.some(([x, y, rx, ry]) => ((u - x) / rx) ** 2 + ((v - y) / ry) ** 2 < 1 + Math.sin(u * 23 + v * 17) * 0.25);
  };
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const u = (i + 0.5 - N / 2) / R, v = (j + 0.5 - N / 2) / R, d = u * u + v * v; if (d > 1) continue;
    const light = 1 - Math.max(0, (u + 0.4) * 0.35 + (v + 0.4) * 0.3), edge = d > 0.82;
    let col = land(u, v) ? (Math.abs(v) < 0.25 && u > -0.2 && u < 0.4 ? "#d8b86a" : v < -0.75 ? "#e8f0f4" : "#4a9a3a") : (light > 0.9 ? "#3a8ad8" : "#2a6ab8");
    if (edge) col = land(u, v) ? "#2a6a2a" : "#1a4a8a";
    c.fillStyle = col; c.fillRect(i, j, 1, 1);
  }
  c.fillStyle = "rgba(255,255,255,0.55)"; c.fillRect(9, 8, 3, 1); c.fillRect(8, 9, 2, 2);
}

/* ---------------- The menu: rings, as in the old games ---------------- */
const RINGS = [
  { id: "charakter", label: "CHARAKTER", x: 0.27, y: 0.17, s: 0.31, icon: "ritter", rc: "#8d929c" },
  { id: "mensa", label: "MENSA", x: 0.75, y: 0.17, s: 0.29, icon: "mensa", rc: "#a07a52" },
  { id: "mundi", label: "MUNDI", x: 0.5, y: 0.48, s: 0.42, icon: "globe", rc: "#a07a52", fs: "28px" },
  { id: "curriculum", label: "CURRICULUM", x: 0.42, y: 0.8, s: 0.29, icon: "buch", rc: "#8d929c" },
  { id: "castra", label: "CASTRA", x: 0.84, y: 0.78, s: 0.2, icon: "zelt", rc: "#a07a52", fs: "15px" },
];
function layout() {
  const box = $("#rings"), W = innerWidth, top = 80, bot = 90, H = innerHeight - top - bot, unit = Math.min(W, H * 0.62);
  box.querySelectorAll(".ring").forEach((e) => e.remove());
  const pos = {};
  for (const r of RINGS) {
    const b = document.createElement("button"); b.type = "button"; b.className = "ring"; b.dataset.id = r.id;
    const x = W * r.x, y = top + H * r.y, s = unit * r.s; pos[r.id] = [x, y, s];
    b.style.left = x + "px"; b.style.top = y + "px"; b.style.setProperty("--s", s + "px"); b.style.setProperty("--rc", r.rc); if (r.fs) b.style.setProperty("--fs", r.fs);
    b.innerHTML = `<div class="disc"><canvas></canvas></div><b>${r.label}</b><small id="sub-${r.id}"></small>`;
    if (r.icon === "globe") drawGlobe(b.querySelector("canvas")); else drawIcon(b.querySelector("canvas"), ICON[r.icon]);
    b.onclick = () => open(r.id); box.append(b);
  }
  // the iron rings that join them
  const [mx, my, ms] = pos.mundi, R = Math.hypot(pos.charakter[0] - mx, pos.charakter[1] - my);
  $("#links").innerHTML = `<circle cx="${mx}" cy="${my}" r="${R}" fill="none" stroke="#5a606a" stroke-width="5"/><circle cx="${mx}" cy="${my}" r="${R}" fill="none" stroke="#8d929c" stroke-width="2"/>
    <line x1="${mx}" y1="${my}" x2="${pos.curriculum[0]}" y2="${pos.curriculum[1]}" stroke="#8d929c" stroke-width="4"/>`;
  subs();
}
function subs() {
  const s = S.get(), fast = S.read("crusaders-fasten", {}), tr = S.read("crusaders-training", {});
  const set = (id, t) => { const e = $("#sub-" + id); if (e) e.textContent = t; };
  set("mundi", s.jobs.length ? `${s.jobs.length} Aufträge` : "In die Welt");
  set("mensa", fast.start ? "Fastest " + hm(Date.now() - fast.start) : "");
  set("curriculum", tr.start ? "Training läuft" : `${Object.keys(window.Postcards.found()).length} Funde`);
  set("castra", ["Wrack", "Feuer", "Zelt", "Palisade", "Steg", "Werft", "Hafen"][s.camp] || "");
  set("charakter", (S.me() || S.GENERICA).name);
}
const hm = (ms) => { const m = Math.floor(ms / 60000); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`; };
function bar() {
  const s = S.get(), m = S.me();
  $("#who").textContent = "SPIELER: " + (m ? m.name : "Generica").toUpperCase();
  $("#expBar").style.width = Math.round((s.exp / S.expFor(s.level)) * 100) + "%";
  $("#lvl").textContent = `${S.rank(s.level)} · ${s.level}`;
  $("#devBtn").hidden = !s.aura;
}

/* ---------------- Sheets ---------------- */
let current = null;
function open(id) {
  if (id === "mundi") { location.href = "welt/"; return; }
  if (id === "castra") { location.href = "lager/"; return; }
  current = id; $("#sh").hidden = false; render();
}
$("#shX").onclick = () => { $("#sh").hidden = true; current = null; bar(); subs(); };
function render() {
  const f = { charakter: charakter, mensa: mensa, curriculum: codex, dev: dev }[current];
  $("#shT").textContent = { charakter: "CHARAKTER", mensa: "MENSA · FASTEN", curriculum: "CURRICULUM · CODEX", dev: "✨ AURA DES DEV" }[current];
  f($("#shIn"));
}

/* Charakter: choose who you play, or play without one */
function charakter(el) {
  const list = S.heroes(), cur = S.me(), aura = S.get().aura;
  const card = (h, isGen) => { const st = S.get(isGen ? null : h), on = isGen ? !cur : cur && cur.id === h.id;
    return `<div class="hero ${on ? "on" : ""}"><div class="ic">${isGen ? "🕯" : h.sex === "f" ? "♀" : "♂"}</div><div class="t"><b>${isGen ? "Generica" : h.name}</b>
      <small>${isGen ? "Ohne Charakter, ein namenloser Pilger" : "von " + h.von[0] + (h.von[1] ? ", " + h.von[1] : "")}<br>${S.rank(st.level)} · Stufe ${st.level} · 🪙 ${st.gold}</small></div>
      <div class="row">${on ? `<span style="color:var(--gold);font:700 14px 'Pixelify Sans'">SPIELT</span>` : `<button type="button" class="btn" data-play="${isGen ? "" : h.id}">Spielen</button>`}
      ${on && !isGen ? `<a class="btn ghost" href="charakter/" style="text-decoration:none">Gestalt</a>` : ""}${aura && !isGen ? `<button type="button" class="btn ghost" data-del="${h.id}">✕</button>` : ""}</div></div>`; };
  el.innerHTML = `<p class="note">Jeder Charakter hat seinen eigenen Weg: Stufe, Gold, Lager, Aufträge. Deine Funde und dein Codex gehören dir selbst.</p>
    ${list.map((h) => card(h, false)).join("")}${card(null, true)}
    <a class="btn" href="charakter/?neu=1" style="display:block;text-align:center;text-decoration:none;margin-top:12px">+ Neuen Charakter erschaffen</a>`;
  el.querySelectorAll("[data-play]").forEach((b) => b.onclick = () => { const h = list.find((x) => x.id === b.dataset.play); S.choose(h || null); toast(h ? `${h.name} tritt vor.` : "Du spielst als Generica."); render(); bar(); subs(); paintBg(); });
  el.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
    const h = list.find((x) => x.id === b.dataset.del); if (!confirm(`${h.name} und den ganzen Spielstand löschen?`)) return;
    S.wipe(h); S.write("crusaders-helden", list.filter((x) => x.id !== h.id)); if (cur && cur.id === h.id) S.choose(null); render(); bar();
  });
}

/* Mensa: fasting, with a timer, and a reward when you break the fast */
const FAST = [
  { h: 12, name: "Kleines Fasten", exp: 40, gold: 20 }, { h: 16, name: "Fasten der Mönche", exp: 80, gold: 35 },
  { h: 20, name: "Bis zur Vesper", exp: 120, gold: 50 }, { h: 24, name: "Ein ganzer Tag", exp: 200, gold: 80, figs: 3 },
  { h: 36, name: "Vigil", exp: 320, gold: 120, figs: 3 }, { h: 48, name: "Pilgerfasten", exp: 500, gold: 200, figs: 5 },
];
function mensa(el) {
  const f = S.read("crusaders-fasten", { start: null, hist: [] }), on = !!f.start, hrs = on ? (Date.now() - f.start) / 3.6e6 : 0;
  const best = FAST.filter((x) => hrs >= x.h).pop();
  el.innerHTML = `<div class="clock"><b id="fClock">${on ? hm(Date.now() - f.start) : "0:00"}</b><small>${on ? "fastest seit " + new Date(f.start).toLocaleString("de-DE", { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "Wasser, Tee und schwarzer Kaffee sind erlaubt."}</small></div>
    <div style="display:flex;gap:8px;justify-content:center">${on ? `<button type="button" class="btn" id="fEnd">${best ? "Fasten brechen · Belohnung holen" : "Fasten brechen"}</button>` : `<button type="button" class="btn" id="fGo">Fasten beginnen</button>`}</div>
    <div class="stages">${FAST.map((x) => `<div class="stage ${on && hrs >= x.h ? "got" : ""}"><div class="h">${x.h} h</div><div class="n"><b>${x.name}</b>${on && hrs < x.h ? "noch " + hm((x.h - hrs) * 3.6e6) : on ? "erreicht ✓" : ""}</div><div class="r">+${x.exp} EXP<br>+${x.gold} Gold${x.figs ? ` · ${x.figs} Feigen` : ""}</div></div>`).join("")}</div>
    <p class="note">Die Belohnung bekommt der Charakter, mit dem du das Fasten brichst. Bisher: ${f.hist.length}× gefastet, ${Math.round(f.hist.reduce((a, b) => a + b.h, 0))} Stunden.</p>`;
  if ($("#fGo")) $("#fGo").onclick = () => { f.start = Date.now(); S.write("crusaders-fasten", f); toast("Das Fasten beginnt. Die Mensa bleibt kalt."); render(); subs(); };
  if ($("#fEnd")) $("#fEnd").onclick = () => {
    if (!best && !confirm("Noch keine 12 Stunden. Trotzdem brechen? Dann gibt es keine Belohnung.")) return;
    f.hist.push({ start: f.start, end: Date.now(), h: Math.round(hrs * 10) / 10 }); f.start = null; S.write("crusaders-fasten", f);
    if (best) { const s = S.reward(best.exp, best.gold); if (best.figs) { s.figs += best.figs; delete s.up; S.save(s); } toast(`${best.name}: +${best.exp} EXP · +${best.gold} Gold${s.up ? " · Stufe " + s.level + "!" : ""}`, 5000); }
    render(); subs(); bar();
  };
}
setInterval(() => { if (current === "mensa" && $("#fClock")) { const f = S.read("crusaders-fasten", {}); if (f.start) $("#fClock").textContent = hm(Date.now() - f.start); } if (current === "curriculum" && $("#tClock")) { const t = S.read("crusaders-training", {}); if (t.start) $("#tClock").textContent = hm(Date.now() - t.start); } }, 20000);

/* Curriculum: the codex, a tree of everything you have done */
const TRAIN = ["Laufen", "Kraft", "Rad", "Schwimmen", "Yoga", "Wandern"];
function codex(el) {
  const s = S.get(), PCs = window.Postcards, found = PCs.found(), spots = PCs.spots;
  const diary = S.read("atemlotse-tagebuch", []), fast = S.read("crusaders-fasten", { hist: [] }), tr = S.read("crusaders-training", { hist: [] });
  const node = (got, text, extra = "", part = false) => `<li><span class="node ${got ? "got" : part ? "part" : ""}"><i>${got ? "✓" : ""}</i>${text}${extra ? " <em>" + extra + "</em>" : ""}</span></li>`;
  const ONE = { "Übungen": "Übung", "Einheiten": "Einheit", "Stunden": "Stunde", "Aufträge": "Auftrag" };
  const ms = (n, steps, word) => steps.map((k) => node(n >= k, `${k} ${k === 1 && ONE[word] ? ONE[word] : word}`, n < k ? `${n}/${k}` : "")).join("");
  // Kultur: kinds, then works, then the places each work is found in
  const kinds = {}; for (const sp of spots) { const k = sp.kind, it = sp.kind === "postkarte" ? sp.name : sp.item || sp.title || sp.name; ((kinds[k] = kinds[k] || {})[it] = kinds[k][it] || []).push(sp); }
  const KPL = { postkarte: "Postkarten", gesetzesrolle: "Gesetzesrollen", filmposter: "Filmposter", flora: "Flora", skulptur: "Skulpturen", literatur: "Literatur" };
  const kultur = Object.entries(kinds).map(([k, items]) => {
    const all = Object.values(items).flat(), n = all.filter((x) => found[x.id]).length;
    return `<li><details ${n ? "open" : ""}><summary><span class="node ${n === all.length ? "got" : n ? "part" : ""}"><i>${n === all.length ? "✓" : ""}</i>${KPL[k] || k} <em>${n}/${all.length}</em></span></summary><ul class="tree">${Object.entries(items).map(([it, list]) => {
      const m = list.filter((x) => found[x.id]).length;
      return list.length === 1 ? node(m === 1, m ? it : "???", m ? list[0].place || "" : "") : `<li><span class="node ${m === list.length ? "got" : m ? "part" : ""}"><i>${m === list.length ? "✓" : ""}</i>${m ? it : "???"} <em>${m}/${list.length} Orte</em></span><ul class="tree">${list.map((x) => node(!!found[x.id], found[x.id] ? x.place || x.name : "???")).join("")}</ul></li>`;
    }).join("")}</ul></details></li>`;
  }).join("");
  // Atem: sessions from the Changes app on this phone
  const bis = s.log.atemBis || 0, neu = diary.filter((e) => (e.start || 0) > bis), kindsDone = [...new Set(diary.map((e) => e.what).filter(Boolean))];
  // Training and fasting
  const trMin = tr.hist.reduce((a, b) => a + b.min, 0), fastH = fast.hist.reduce((a, b) => a + b.h, 0), fastMax = Math.max(0, ...fast.hist.map((x) => x.h));
  const fac = window.Staedte ? window.Staedte.FACTIONS : null;
  el.innerHTML = `<p class="note">Alles, was du erlebt, gesammelt und geübt hast, wächst hier zu einem Baum.</p>
    <div class="br"><div class="head"><div class="orb">🏛</div><div><b>Kultur</b><small>${Object.keys(found).length} von ${spots.length} Funden</small></div><button type="button" class="btn ghost" id="cSam">Sammlung</button></div><ul class="tree">${kultur}</ul></div>
    <div class="br"><div class="head"><div class="orb">🌬</div><div><b>Atem</b><small>${diary.length} Übungen im Tagebuch von Changes</small></div>${neu.length ? `<button type="button" class="btn" id="cAtem">${neu.length}× abholen</button>` : `<a class="btn ghost" href="/changes/" style="text-decoration:none">Atmen</a>`}</div>
      <ul class="tree">${ms(diary.length, [1, 10, 30, 100], "Übungen")}<li><details><summary><span class="node ${kindsDone.length ? "part" : ""}"><i></i>Arten <em>${kindsDone.length}</em></span></summary><ul class="tree">${kindsDone.map((k) => node(true, k)).join("") || node(false, "noch keine")}</ul></details></li></ul></div>
    <div class="br"><div class="head"><div class="orb">⚔</div><div><b>Training</b><small>${tr.hist.length} Einheiten · ${hm(trMin * 60000)} h</small></div></div>
      <div style="margin:8px 0 4px 4px">${tr.start ? `<div class="clock" style="margin:0"><b id="tClock" style="font-size:34px">${hm(Date.now() - tr.start)}</b><small>${tr.type} läuft</small></div><div style="text-align:center"><button type="button" class="btn" id="tEnd">Training beenden · Belohnung</button></div>`
        : `<div class="chips">${TRAIN.map((t, i) => `<button type="button" data-tr="${t}" aria-pressed="${i === 0}">${t}</button>`).join("")}</div><button type="button" class="btn" id="tGo">Training starten</button>`}</div>
      <ul class="tree">${ms(tr.hist.length, [1, 10, 25, 50], "Einheiten")}${ms(Math.floor(trMin / 60), [1, 10, 50], "Stunden")}</ul></div>
    <div class="br"><div class="head"><div class="orb">🥣</div><div><b>Fasten</b><small>${fast.hist.length}× · ${Math.round(fastH)} Stunden</small></div><button type="button" class="btn ghost" id="cFast">Mensa</button></div>
      <ul class="tree">${FAST.map((x) => node(fastMax >= x.h, `${x.name} (${x.h} h)`)).join("")}${ms(fast.hist.filter((x) => x.h >= 12).length, [5, 20], "Fasten")}</ul></div>
    <div class="br"><div class="head"><div class="orb">🛡</div><div><b>Taten</b><small>${S.me() ? S.me().name : "Generica"} · Stufe ${s.level}</small></div></div>
      <ul class="tree">${node(s.party.includes("porthos"), "Porthos befreit")}${ms(s.level, [3, 5, 10], "Stufen").replace(/(\d+) Stufen/g, "Stufe $1")}${ms(s.log.jobsDone || 0, [1, 10, 25], "Aufträge")}
      ${node(s.camp >= 6, "Ein Kreuzfahrerhafen", s.camp < 6 ? `${s.camp}/6` : "")}${node(!!(s.quests.mitra && s.quests.mitra.done), "Die Hohepriesterin der Mitra bezwungen")}${fac ? Object.entries(fac).filter(([, f]) => !f.noJobs).map(([k, f]) => node((s.rep[k] || 0) >= 50, `Freund: ${f.name}`, (s.rep[k] || 0) < 50 ? `Ruf ${s.rep[k] || 0}/50` : "")).join("") : ""}</ul></div>`;
  $("#cSam").onclick = () => { $("#sh").hidden = true; current = null; window.Postcards.open(); };
  $("#cFast").onclick = () => { current = "mensa"; render(); };
  if ($("#cAtem")) $("#cAtem").onclick = () => {
    const r = S.reward(25 * neu.length, 5 * neu.length); r.log.atemBis = Math.max(...diary.map((e) => e.start || 0)); delete r.up; S.save(r);
    toast(`Atem: +${25 * neu.length} EXP · +${5 * neu.length} Gold${r.level > s.level ? " · Stufe " + r.level + "!" : ""}`, 5000); render(); bar();
  };
  el.querySelectorAll("[data-tr]").forEach((b) => b.onclick = () => el.querySelectorAll("[data-tr]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))));
  if ($("#tGo")) $("#tGo").onclick = () => { tr.start = Date.now(); tr.type = el.querySelector("[data-tr][aria-pressed=true]").dataset.tr; S.write("crusaders-training", tr); toast(`${tr.type}: los geht's. Komm danach zurück und hol dir die Belohnung.`); render(); subs(); };
  if ($("#tEnd")) $("#tEnd").onclick = () => {
    const min = Math.round((Date.now() - tr.start) / 60000);
    if (min < 10 && !confirm("Unter 10 Minuten gibt es keine Belohnung. Trotzdem beenden?")) return;
    tr.hist.push({ start: tr.start, end: Date.now(), min, type: tr.type }); tr.start = null; S.write("crusaders-training", tr);
    if (min >= 10) { const m = Math.min(120, min), r = S.reward(3 * m, Math.round(m / 2)); toast(`${tr.type}, ${min} Minuten: +${3 * m} EXP · +${Math.round(m / 2)} Gold${r.up ? " · Stufe " + r.level + "!" : ""}`, 5000); }
    render(); subs(); bar();
  };
}

/* Aura des Dev: switch it, and wipe what you want to try again */
function dev(el) {
  const s = S.get(), m = S.me();
  el.innerHTML = `<p class="note">Mit der Aura gilt deine Figur als dein Standort. Hier setzt du außerdem zurück, was du noch einmal von vorn erleben willst.</p>
    <div class="dev">
      <label><input type="checkbox" id="dPc"><span>Postkarten und Funde<small>Für alle Charaktere, auch auf der Karte</small></span></label>
      <label><input type="checkbox" id="dMe"><span>Spielstand von ${m ? m.name : "Generica"}<small>Stufe, Gold, Lager, Porthos, Aufträge, Ruf, abgeholte Atem-Belohnungen</small></span></label>
      <label><input type="checkbox" id="dTime"><span>Fasten- und Trainingsverlauf<small>Laufende Timer und alle Einträge</small></span></label>
      <label><input type="checkbox" id="dAll"><span>Alle Charaktere<small>Löscht jeden Charakter samt Spielstand, auch vergebene Namen</small></span></label>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button type="button" class="btn" id="dGo">Zurücksetzen</button><button type="button" class="btn ghost" id="dAura">Aura ausschalten</button></div>`;
  $("#dAura").onclick = () => { const t = S.get(); t.aura = false; S.save(t); toast("Aura aus. In der Welt kannst du sie wieder einschalten."); $("#sh").hidden = true; current = null; bar(); };
  $("#dGo").onclick = () => {
    const pick = ["dPc", "dMe", "dTime", "dAll"].filter((id) => $("#" + id).checked); if (!pick.length) return toast("Nichts ausgewählt.");
    if (!confirm("Wirklich zurücksetzen? Das lässt sich nicht rückgängig machen.")) return;
    if (pick.includes("dPc")) S.write("rhodos-postkarten", null);
    if (pick.includes("dMe")) S.wipe();
    if (pick.includes("dTime")) { S.write("crusaders-fasten", null); S.write("crusaders-training", null); }
    if (pick.includes("dAll")) { for (const h of S.heroes()) S.wipe(h); S.wipe(null); S.write("crusaders-helden", null); S.write("crusaders-ich", null); S.write("crusaders-vergeben", null); }
    location.reload();
  };
}
$("#devBtn").onclick = () => { current = "dev"; $("#sh").hidden = false; render(); };

S.heroes();
paintBg(); layout(); bar();
addEventListener("resize", () => { paintBg(); layout(); });
const want = new URLSearchParams(location.search).get("zu"); if (want) open(want);
</script>
<script src="staedte.js"></script>
</body>
</html>
