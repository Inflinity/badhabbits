<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c140c">
<title>Crusaders · Lager</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #2b1d12; --parch: #f1e4c4; --gold: #d9b56e; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; background: #1c140c; color: var(--parch); font: 16px/1.4 "IM Fell English", Georgia, serif; }
/* the camp is a place of its own: the beach of the wreck, and what you build on it */
.scene { position: relative; height: 58vh; min-height: 300px; background: #1c140c url("../bilder/lager-wrack.jpg") center 58% / cover; transition: background-image 0.6s; overflow: hidden; }
.scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(20,12,6,0.55), rgba(20,12,6,0) 30%, rgba(20,12,6,0) 75%, rgba(20,12,6,0.6)); pointer-events: none; }
#px { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 55%; image-rendering: pixelated; z-index: 1; }
.top { position: absolute; left: 10px; right: 10px; top: max(10px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; z-index: 2; }
.back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--parch); border: 2px solid var(--gold); color: var(--ink); text-decoration: none; font-size: 24px; box-shadow: 0 3px 10px rgba(0,0,0,0.35); }
.purse { background: rgba(20,12,6,0.75); border: 2px solid var(--gold); border-radius: 18px; padding: 5px 14px; font: 600 16px "Pixelify Sans", monospace; }
.title { position: absolute; left: 0; right: 0; top: calc(max(10px, env(safe-area-inset-top)) + 54px); text-align: center; z-index: 2; }
.title h1 { margin: 0; font: 800 26px "Cinzel", serif; letter-spacing: 0.06em; text-shadow: 0 2px 8px #000; }
.title p { margin: 2px 0 0; font-style: italic; color: #ffe9b8; text-shadow: 0 1px 4px #000; }
main { padding: 14px 14px max(20px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.board { background: linear-gradient(#f3e6c6, #e6d3a6); color: var(--ink); border-radius: 6px; padding: 12px 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 0 0 2px #b9925a; }
.board h2 { margin: 0 0 8px; font: 800 15px "Cinzel", serif; letter-spacing: 0.08em; color: #6a3a14; }
.q { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed #b9925a; }
.q:first-of-type { border-top: 0; }
.q .ic { font-size: 26px; width: 36px; text-align: center; }
.q b { display: block; font: 700 16px "Cinzel", serif; }
.q small { display: block; color: #6a5030; }
.openBtn { display: block; width: 100%; margin-top: 8px; font: 700 16px "Pixelify Sans", monospace; padding: 10px; border-radius: 8px; border: 2px solid #e6b44a; background: linear-gradient(#c9963c, #8a5a1c); color: #fff6dc; cursor: pointer; }
.q .st { margin-left: auto; font: 600 14px "Pixelify Sans", monospace; white-space: nowrap; }
.q.done b { text-decoration: line-through; opacity: 0.6; }
.stage { display: flex; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px dashed #b9925a; }
.stage:first-of-type { border-top: 0; }
.stage .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #b9925a; color: #fff; font: 700 13px "Pixelify Sans", monospace; flex: 0 0 auto; }
.stage.built .n { background: #4a7a3a; }
.stage.built .n::after { content: "✓"; }
.stage.built .n span { display: none; }
.stage b { display: block; font: 700 15px "Cinzel", serif; }
.stage small { color: #6a5030; }
.stage button { margin-left: auto; font: 700 15px "Pixelify Sans", monospace; padding: 7px 12px; border-radius: 7px; border: 2px solid #e6b44a; background: linear-gradient(#c9963c, #8a5a1c); color: #fff6dc; cursor: pointer; white-space: nowrap; }
.stage button:disabled { filter: grayscale(0.8); opacity: 0.6; }
.go { display: block; text-align: center; padding: 12px; border-radius: 10px; background: linear-gradient(#2a6fa8, #1d4f7c); border: 2px solid var(--gold); color: #fff; text-decoration: none; font: 800 15px "Cinzel", serif; letter-spacing: 0.06em; }
#toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); max-width: 92%; z-index: 9; background: rgba(241,228,196,0.96); color: var(--ink); border: 2px solid var(--gold); border-radius: 10px; padding: 8px 14px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
</style>
</head>
<body>
<div class="scene">
  <canvas id="px"></canvas>
  <div class="top"><a class="back" href="../welt/" aria-label="Zur Welt">‹</a><div class="purse" id="purse">🪙 0</div></div>
  <div class="title"><h1 id="campName">Die Wrackstelle</h1><p id="campSub">Am Strand von Tsambika</p></div>
</div>
<main>
  <section class="board"><h2>Questbrett</h2><div id="quests"></div></section>
  <section class="board"><h2>Gefährten</h2><div id="comps"></div></section>
  <section class="board" id="chestBox"><h2>Die Beutetruhe</h2><div id="chest"></div></section>
  <section class="board"><h2>Vom Wrack zum Kreuzfahrerhafen</h2><div id="stages"></div></section>
  <a class="go" href="../welt/">⚔ Hinaus in die Welt</a>
</main>
<div id="toast" hidden></div>
<script src="../kampf.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const toast = (t, ms = 4000) => { const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.tm); toast.tm = setTimeout(() => { e.hidden = true; }, ms); };

// what the wreck becomes, step by step, paid in gold
const STAGES = [
  { name: "Die Wrackstelle", sub: "Am Strand von Tsambika", what: "Was das Meer übrig ließ", cost: 0 },
  { name: "Das Lagerfeuer", sub: "Ein Feuer gegen die Nacht", what: "Treibholz und Feuerstein", cost: 30 },
  { name: "Die Zeltplane", sub: "Das Wrack ist ausgeschlachtet", what: "Das alte Segel, über Ruder gespannt; das Wrack wird geräumt", cost: 60 },
  { name: "Die Palisade", sub: "Ein Lager, das sich wehren kann", what: "Spitze Pfähle gegen Wegelagerer", cost: 120 },
  { name: "Der Holzsteg", sub: "Boote können anlegen", what: "Ein Steg ins flache Wasser", cost: 200 },
  { name: "Die Werft", sub: "Hier entsteht ein Schiff", what: "Spanten, Kiel und Teer", cost: 350 },
  { name: "Der Kreuzfahrerhafen", sub: "Ein Hafen unter deinem Banner", what: "Turm, Mole und Banner", cost: 600 },
];
// character quests: they belong to you, not to the world
const QUESTS = [
  { id: "porthos", icon: "🐕", name: "Befreie Porthos", sub: "Sklavenhändler Kerim hält deinen Kriegshund in Ketten. Er ist heute etwa 1 km von dir entfernt.", lvl: 1, done: "Porthos weicht dir nicht mehr von der Seite." },
  { id: "brueder", icon: "🍺", name: "Die Raufboldbrüder", sub: "Nach Porthos: zwei Nordmänner prügeln sich in einer Taverne. Schlag sie beide, dann folgen sie dir.", lvl: 2, done: "Helgen und Theoderich ziehen mit dir." },
  { id: "truhe", icon: "🧰", name: "Die Truhe aus dem Wrack", sub: "Sobald du einen Gefährten hast: Strandräuber schleppen eine Truhe aus deinem Wrack fort.", lvl: 1, done: "Die Beutetruhe steht im Lager." },
  { id: "mitra", icon: "🐍", name: "Das Zeichen der Schlange", sub: "Kerims Amulett führt zu den Schwestern der Mitra.", lvl: 3, done: "Die Hohepriesterin ist geschlagen. Vorerst." },
];
const clockOf = (t) => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
let ST = window.Spiel.get();

function render() {
  const s = (ST = window.Spiel.get()), at = s.camp, C = window.Spiel.COMP, now = Date.now();
  $("#purse").textContent = `🪙 ${s.gold} · ${window.Spiel.rank(s.level)} · Stufe ${s.level}`;
  // the wreck stands until you strip it for the tarp; from then on the beach is cleared
  $(".scene").style.backgroundImage = `url("../bilder/${at >= 2 ? "lager-geraeumt" : "lager-wrack"}.jpg")`;
  $("#campName").textContent = STAGES[at].name; $("#campSub").textContent = STAGES[at].sub;
  $("#quests").innerHTML = QUESTS.map((q) => {
    const done = s.quests[q.id] && s.quests[q.id].done;
    return `<div class="q ${done ? "done" : ""}"><div class="ic">${q.icon}</div><div><b>${q.name}</b><small>${done ? "Erledigt. " + q.done : q.sub}</small></div><div class="st">${done ? "✓" : "Stufe " + q.lvl}</div></div>`;
  }).join("");
  // who is with you, and who is away
  const ex = s.excursions.filter((e) => !e.claimed), away = (c) => ex.find((e) => e.who.includes(c) && e.end > now);
  $("#comps").innerHTML = s.party.filter((c) => C[c]).map((c) => { const a = away(c);
    return `<div class="q"><div class="ic">${C[c].icon}</div><div><b>${C[c].name}</b><small>${C[c].desc}</small></div><div class="st">${a ? "unterwegs<br>bis " + clockOf(a.end) : "im Lager"}</div></div>`; }).join("")
    || `<p style="margin:0;font-style:italic">Noch bist du allein. Befreie Porthos.</p>`;
  // the loot chest: what the companions bring home from their excursions
  const back = ex.filter((e) => e.end <= now), out = ex.filter((e) => e.end > now);
  $("#chest").innerHTML = !s.chest ? `<p style="margin:0;font-style:italic">Noch keine Truhe. Sobald du einen Gefährten hast, findest du in der Welt die Quest „Die Truhe aus dem Wrack“.</p>`
    : `<p style="margin:0 0 6px">Schick deine Gefährten im Auftragsbrett einer Stadt (🏰 in der Welt) auf Exkursion. Was sie heimbringen, landet hier.</p>
      ${out.map((e) => `<div class="q"><div class="ic">⚑</div><div><b>${e.name}</b><small>${e.who.map((c) => C[c].name).join(" und ")} · für ${e.facName} in ${e.town}</small></div><div class="st">zurück<br>${clockOf(e.end)}</div></div>`).join("")}
      ${back.map((e) => `<div class="q"><div class="ic">${e.ok ? "💰" : "🩹"}</div><div><b>${e.name}</b><small>${e.ok ? "Geschafft!" : "Mit blauen Flecken zurück, nur ein Teil der Beute."} +${e.exp} EXP · +${e.gold} Gold${e.goods.length ? " · " + e.goods.join(", ") : ""}</small></div><div class="st">${e.who.map((c) => C[c].icon).join("")}</div></div>`).join("")}
      ${back.length ? `<button type="button" id="open" class="openBtn">🧰 Truhe öffnen</button>` : !out.length ? `<p style="margin:6px 0 0;font-style:italic">Die Truhe ist leer.</p>` : ""}`;
  if ($("#open")) $("#open").onclick = () => {
    let exp = 0, gold = 0; const t0 = window.Spiel.get();
    for (const e of t0.excursions) if (!e.claimed && e.end <= Date.now()) { exp += e.exp; gold += e.gold; }
    const t = window.Spiel.reward(exp, gold);
    for (const e of t.excursions) if (!e.claimed && e.end <= Date.now()) {
      e.claimed = true; for (const g of e.goods) t.inv[g] = (t.inv[g] || 0) + 1;
      if (e.ok) t.rep[e.fac] = Math.min(100, (t.rep[e.fac] || 0) + 4);
      t.log.exDone = (t.log.exDone || 0) + 1;
    }
    t.excursions = t.excursions.filter((e) => !e.claimed || Date.now() - e.end < 864e5);
    delete t.up; window.Spiel.save(t);
    toast(`Die Truhe: +${exp} EXP · +${gold} Gold${t.level > s.level ? " · Stufe " + t.level + "!" : ""}`); render();
  };
  $("#stages").innerHTML = STAGES.map((g, i) => `<div class="stage ${i <= at ? "built" : ""}"><div class="n"><span>${i + 1}</span></div>
    <div><b>${g.name}</b><small>${g.what}</small></div>
    ${i === at + 1 ? `<button type="button" data-i="${i}" ${s.gold < g.cost ? "disabled" : ""}>🪙 ${g.cost}</button>` : i > at + 1 ? `<small style="margin-left:auto">🪙 ${g.cost}</small>` : ""}</div>`).join("");
  const b = $("#stages button");
  if (b) b.onclick = () => {
    const t = window.Spiel.get(), g = STAGES[+b.dataset.i]; if (t.gold < g.cost) return;
    t.gold -= g.cost; t.camp = +b.dataset.i; window.Spiel.save(t);
    toast(`${g.name} steht. ${g.sub}.`); render();
  };
}

/* ---------------- The pixel camp ---------------- */
const cv = $("#px"), ctx = cv.getContext("2d");
let W = 200, H = 90;
function size() { W = 200; H = Math.round((W * cv.clientHeight) / Math.max(1, cv.clientWidth)); cv.width = W; cv.height = H; }
const R = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function draw(now) {
  const at = ST.camp, party = ST.party, g = H - 14, home = (c) => party.includes(c) && !ST.excursions.some((e) => e.who.includes(c) && e.end > Date.now());      // g: the sand line where things stand
  ctx.clearRect(0, 0, W, H);
  // the wreck is the painting behind; what you build stands in front of it
  // 3 the palisade, at the back, so the rest stands in front of it
  if (at >= 3) for (let x = 2; x < W - 70; x += 5) { if (x > 52 && x < 64) continue; R("#7a5230", x, g - 22, 4, 16); R("#9a6a3a", x + 1, g - 24, 2, 2); R("#5a3a20", x, g - 15, 4, 1); }
  // 1 the campfire
  if (at >= 1) {
    const fx = 70; R("#5a3a20", fx - 6, g - 2, 13, 2); R("#3a2414", fx - 4, g - 4, 9, 2);
    const f = Math.sin(now / 90) > 0 ? 1 : 0;
    R("#e2541a", fx - 3, g - 8 - f, 7, 5); R("#ffb030", fx - 2, g - 10 + f, 5, 5); R("#fff2a8", fx - 1, g - 8, 2, 3);
    if (Math.floor(now / 250) % 3 === 0) R("rgba(200,200,200,0.5)", fx + (Math.floor(now / 500) % 3) - 1, g - 16, 2, 2);
  }
  // 2 the tarp tent
  if (at >= 2) { const tx = 28; for (let i = 0; i < 14; i++) R(i % 4 ? "#d8cfb8" : "#bdb39a", tx + 14 - i, g - 14 + i, i * 2 + 1, 1); R("#5a3a20", tx + 14, g - 18, 1, 18); R("#3a2414", tx + 12, g - 8, 5, 8); }
  // 4 the jetty out into the water, on the right
  if (at >= 4) { R("#8a5a32", W - 20, g - 4, 20, 3); for (let i = 0; i < 4; i++) R("#5a3a20", W - 18 + i * 5, g - 1, 2, 10); }
  // 5 the shipyard: a new keel on stocks
  if (at >= 5) { const sx = 92; R("#6a4a2a", sx, g - 4, 34, 3); for (let i = 0; i < 7; i++) { const h = 6 + Math.round(Math.sin((i / 6) * Math.PI) * 8); R("#b9874a", sx + 2 + i * 5, g - 4 - h, 2, h); } R("#3a2414", sx - 2, g - 1, 38, 2); }
  // 6 the crusaders' harbour: a tower and a banner
  if (at >= 6) { const hx = 10; R("#b8a07a", hx, g - 44, 16, 44); for (let i = 0; i < 4; i++) R("#b8a07a", hx - 1 + i * 5, g - 48, 3, 4); R("#3a2414", hx + 6, g - 12, 4, 12); R("#2a1a0c", hx + 6, g - 34, 3, 5);
    R("#5a3a20", hx + 8, g - 62, 1, 14); const w = Math.sin(now / 300) > 0 ? 1 : 0; R("#f2ede2", hx + 9, g - 62, 10, 7 + w); R("#b8322a", hx + 13, g - 62, 2, 7 + w); R("#b8322a", hx + 9, g - 59, 10, 2); }
  // Porthos, once he's free, by the fire
  if (home("porthos")) window.Spiel.sprite(ctx, "hund", 78 + Math.round(Math.sin(now / 1500) * 2), g - 12, {});
  // the brothers, arguing by the fire
  if (home("helgen")) window.Spiel.sprite(ctx, "raufbold", 58, g - 24, window.Spiel.COMP.helgen.pal);
  if (home("theoderich")) window.Spiel.sprite(ctx, "raufbold", 96, g - 24, window.Spiel.COMP.theoderich.pal, true);
  // the loot chest
  if (ST.chest) { const cx = 112, open = ST.excursions.some((e) => !e.claimed && e.end <= Date.now());
    R("#3a2414", cx - 1, g - 9, 14, 10); R("#8a5a32", cx, g - 8, 12, 8); R("#5a3a20", cx, g - 5, 12, 1); R("#c9a04a", cx + 5, g - 6, 2, 3); R("#6a6a6a", cx, g - 8, 1, 8); R("#6a6a6a", cx + 11, g - 8, 1, 8);
    if (open && Math.floor(now / 400) % 2) { R("#ffd24a", cx + 2, g - 11, 2, 2); R("#ffd24a", cx + 8, g - 12, 2, 2); } }
  else { // his empty bowl, a reminder
    R("#6a4a2a", 80, g - 2, 7, 2); R("#3a2414", 81, g - 3, 5, 1);
  }
  requestAnimationFrame(draw);
}
size(); addEventListener("resize", size);
render(); requestAnimationFrame(draw);
setInterval(render, 15000);      // companions come home while you look
</script>
</body>
</html>
