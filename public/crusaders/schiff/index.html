<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2a44">
<title>Crusaders · Schiff</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=IM+Fell+English:ital@0;1&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #2b1d12; --parch: #f1e4c4; --gold: #d9b56e; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; background: #0e2a44; color: var(--parch); font: 16px/1.4 "IM Fell English", Georgia, serif; }
/* your ship, in big pixels on a small sea */
.scene { position: relative; height: 46vh; min-height: 260px; overflow: hidden; background: linear-gradient(#f2b984, #8fb8d8 45%, #2a6aa0 46%, #0e2a44); }
#px { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.top { position: absolute; left: 10px; right: 10px; top: max(10px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; z-index: 2; }
.back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--parch); border: 2px solid var(--gold); color: var(--ink); text-decoration: none; font-size: 24px; box-shadow: 0 3px 10px rgba(0,0,0,0.35); }
.purse { background: rgba(20,12,6,0.75); border: 2px solid var(--gold); border-radius: 18px; padding: 5px 14px; font: 600 16px "Pixelify Sans", monospace; }
.title { position: absolute; left: 0; right: 0; top: calc(max(10px, env(safe-area-inset-top)) + 56px); text-align: center; z-index: 2; }
.title h1 { margin: 0; font: 800 26px "Cinzel", serif; text-shadow: 0 2px 8px #000; }
.title p { margin: 2px 0 0; font-style: italic; color: #ffe9b8; text-shadow: 0 1px 4px #000; }
main { padding: 14px 14px max(20px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.board { background: linear-gradient(#f3e6c6, #e6d3a6); color: var(--ink); border-radius: 6px; padding: 12px 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 0 0 2px #b9925a; }
.board h2 { margin: 0 0 8px; font: 800 15px "Cinzel", serif; letter-spacing: 0.08em; color: #6a3a14; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats div { background: rgba(255,250,235,0.6); border-radius: 8px; padding: 6px; }
.stats b { display: block; font: 700 22px "Pixelify Sans", monospace; } .stats small { color: #6a5030; }
.stage { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed #b9925a; }
.stage:first-of-type { border-top: 0; }
.stage .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #b9925a; color: #fff; font: 700 13px "Pixelify Sans", monospace; flex: 0 0 auto; }
.stage.built .n { background: #2a6aa0; }
.stage b { display: block; font: 700 15px "Cinzel", serif; } .stage small { color: #6a5030; }
.btn { margin-left: auto; font: 700 15px "Pixelify Sans", monospace; padding: 8px 12px; border-radius: 7px; border: 2px solid #e6b44a; background: linear-gradient(#c9963c, #8a5a1c); color: #fff6dc; cursor: pointer; white-space: nowrap; }
.btn:disabled { filter: grayscale(0.8); opacity: 0.6; }
.btn.wide { display: block; width: 100%; margin: 8px 0 0; text-align: center; text-decoration: none; }
input.name { font: 700 18px "Cinzel", serif; width: 100%; padding: 8px 10px; border: 1px solid #b9925a; border-radius: 8px; background: #fffaf0; color: var(--ink); }
#toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); max-width: 92%; z-index: 9; background: rgba(241,228,196,0.97); color: var(--ink); border: 2px solid var(--gold); border-radius: 10px; padding: 8px 14px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
</style>
</head>
<body>
<div class="scene">
  <canvas id="px"></canvas>
  <div class="top"><a class="back" href="../lager/" aria-label="Zum Lager">‹</a><div class="purse" id="purse">🪙 0</div></div>
  <div class="title"><h1 id="shipName">Dein Schiff</h1><p id="shipSub"></p></div>
</div>
<main id="main"></main>
<div id="toast" hidden></div>
<script src="../kampf.js"></script>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const toast = (t, ms = 4000) => { const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.tm); toast.tm = setTimeout(() => { e.hidden = true; }, ms); };
const S = window.Spiel;
/* From a patched boat out of your wreck to a galleon. Cargo makes your bundle at the markets bigger,
   the crew helps your companions on their excursions, and with any ship you sail between the ports. */
const SHIPS = [
  { name: "Fischerboot", sub: "Geflickt aus den Planken deines Wracks", cost: 0, cargo: 5, crew: 2, knots: 4 },
  { name: "Kaiki", sub: "Das Boot der Inseln, mit einem Lateinsegel", cost: 300, cargo: 10, crew: 4, knots: 6 },
  { name: "Kogge", sub: "Bauchig, für Waren über das ganze Meer", cost: 800, cargo: 20, crew: 12, knots: 6 },
  { name: "Galeere", sub: "Ruder und Segel, wie die Ritter sie fuhren", cost: 1600, cargo: 25, crew: 60, knots: 8 },
  { name: "Karacke", sub: "Drei Masten, hohe Kastelle", cost: 3000, cargo: 40, crew: 80, knots: 7 },
  { name: "Galeone", sub: "Die Königin der Meere", cost: 5000, cargo: 60, crew: 150, knots: 9 },
];
window.SHIPS = SHIPS;
function render() {
  const s = S.get(), open = s.level >= 10 || s.aura, sh = s.ship;
  $("#purse").textContent = `🪙 ${s.gold} · Stufe ${s.level}`;
  if (!open) {
    $("#shipName").textContent = "Noch kein Schiff"; $("#shipSub").textContent = "Ab Stufe 10";
    $("#main").innerHTML = `<section class="board"><h2>Ein eigenes Schiff</h2><p>Ab Stufe 10 kannst du aus den Planken deines Wracks ein Boot flicken und es Stück für Stück zur Galeone ausbauen. Noch ${10 - s.level} Stufen.</p></section>`;
    return;
  }
  if (!sh) {
    $("#shipName").textContent = "Die Planken des Wracks"; $("#shipSub").textContent = "Daraus lässt sich etwas machen";
    $("#main").innerHTML = `<section class="board"><h2>Ein Boot flicken</h2><p>Am Strand liegen noch Planken und ein Mast deines Wracks. Mit Teer und Geduld wird daraus ein Boot.${s.level < 10 ? " (Freigeschaltet durch die Aura des Dev.)" : ""}</p>
      <input class="name" id="nm" value="${["Fortuna", "Santa Agathi", "Porthos' Stolz", "Möwe", "Helios"][Math.floor(Math.random() * 5)]}" maxlength="28" aria-label="Name des Schiffs">
      <button type="button" class="btn wide" id="mk">⛵ Boot flicken und taufen</button></section>`;
    $("#mk").onclick = () => { const t = S.get(); t.ship = { stage: 0, name: $("#nm").value.trim() || "Fortuna", since: Date.now() }; S.save(t); toast(`Die ${t.ship.name} schwimmt!`); render(); };
    return;
  }
  const cur = SHIPS[sh.stage], next = SHIPS[sh.stage + 1];
  $("#shipName").textContent = sh.name; $("#shipSub").textContent = `${cur.name} · ${cur.sub}`;
  $("#main").innerHTML = `<section class="board"><h2>${cur.name}</h2>
      <div class="stats"><div><b>${cur.cargo}</b><small>Ladung</small></div><div><b>${cur.crew}</b><small>Mannschaft</small></div><div><b>${cur.knots} kn</b><small>Fahrt</small></div></div>
      <p style="margin:10px 0 0;font-size:15px">Ladung: so viel mehr passt in dein Bündel auf den Märkten. Mannschaft: +${sh.stage * 3} % Erfolg bei Exkursionen. In der Welt liegt dein Schiff im nächsten Hafen; mit ⛵ Segeln fährst du von Hafen zu Hafen.</p>
      <a class="btn wide" href="../welt/">⚓ Zum Schiff in der Welt</a></section>
    <section class="board"><h2>Vom Fischerboot zur Galeone</h2>${SHIPS.map((g, i) => `<div class="stage ${i <= sh.stage ? "built" : ""}"><div class="n">${i <= sh.stage ? "✓" : i + 1}</div>
      <div><b>${g.name}</b><small>${g.sub} · Ladung ${g.cargo} · Mannschaft ${g.crew}</small></div>
      ${i === sh.stage + 1 ? `<button type="button" class="btn" id="up" ${s.gold < g.cost ? "disabled" : ""}>🪙 ${g.cost}</button>` : i > sh.stage + 1 ? `<small style="margin-left:auto">🪙 ${g.cost}</small>` : ""}</div>`).join("")}</section>
    <section class="board"><h2>Taufname</h2><input class="name" id="nm" value="${sh.name}" maxlength="28"></section>`;
  if ($("#up")) $("#up").onclick = () => { const t = S.get(); if (t.gold < next.cost) return; t.gold -= next.cost; t.ship.stage++; S.save(t); toast(`Die ${t.ship.name} ist jetzt eine ${next.name}!`); render(); };
  $("#nm").onchange = (e) => { const t = S.get(); t.ship.name = e.target.value.trim() || t.ship.name; S.save(t); render(); };
}

/* ---------------- The pixel sea ---------------- */
const cv = $("#px"), ctx = cv.getContext("2d");
let W = 200, H = 120;
function size() { W = 200; H = Math.round((W * cv.clientHeight) / Math.max(1, cv.clientWidth)); cv.width = W; cv.height = H; }
const R = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); };
function draw(now) {
  const s = S.get(), sh = s.ship, st = sh ? sh.stage : -1, sea = Math.round(H * 0.62);
  ctx.clearRect(0, 0, W, H);
  // sun, far coast, sea with glitter
  R("#ffe2a0", W * 0.78 - 6, sea - 30, 12, 12); R("#7a8a9a", 0, sea - 6, 70, 6); R("#6a7a8a", 20, sea - 10, 30, 4);
  R("#2a6aa0", 0, sea, W, H - sea); for (let i = 0; i < 40; i++) { const x = (i * 37 + now / 60) % W, y = sea + 3 + ((i * 13) % (H - sea - 4)); R(i % 3 ? "#3a82b8" : "#9ad0f0", x, y, 4, 1); }
  if (st < 0) { // planks on the beach
    R("#d9c08a", 60, sea - 2, 80, 4); for (let i = 0; i < 5; i++) R("#6b4a2a", 66 + i * 14, sea - 5 - (i % 2) * 2, 12, 2); R("#5a3a20", 90, sea - 18, 2, 14); return requestAnimationFrame(draw);
  }
  const bob = Math.round(Math.sin(now / 600) * 1.2), cx = W / 2, L = [22, 30, 44, 56, 64, 74][st], Hh = [5, 6, 9, 7, 11, 12][st], y = sea - 2 + bob;
  // hull
  for (let i = 0; i < Hh; i++) { const w = L - i * 1.4; R(i === 0 ? "#3a2414" : i < 2 ? "#5a3a20" : "#7a5230", cx - L / 2 + (L - w) / 2 + (i < Hh / 2 ? 0 : i * 0.3), y - Hh + i, w, 1); }
  R("#e2b04a", cx - L / 2 + 2, y - Hh + 1, L - 4, 1);
  if (st >= 4) { R("#5a3a20", cx + L / 2 - 14, y - Hh - 6, 12, 6); R("#5a3a20", cx - L / 2 + 2, y - Hh - 4, 10, 4); }    // castles fore and aft
  if (st === 3) for (let i = 0; i < 9; i++) R("#3a2414", cx - L / 2 + 6 + i * 5, y - 2, 1, 6);                       // oars
  // masts and sails
  const masts = [[0], [0], [0], [0], [-18, 2, 20], [-24, 0, 24]][st], tall = [16, 22, 30, 26, 38, 44][st];
  masts.forEach((mx, k) => {
    const h = k === masts.length - 1 && masts.length > 1 ? tall * 0.7 : tall, x = cx + mx, top = y - Hh - h;
    R("#4a2e18", x, top, 1, h);
    if (st === 1 || st === 3) { for (let i = 0; i < h * 0.8; i++) R("#f2ede2", x + 1, top + 2 + i, Math.max(1, (i * 0.7) | 0), 1); }    // lateen
    else { const sw = [10, 0, 18, 0, 16, 18][st]; for (let r = 0; r < (st >= 4 ? 2 : 1); r++) { const sy = top + 3 + r * (h * 0.42), sh2 = h * 0.36; R("#f2ede2", x - sw / 2, sy, sw, sh2); R("#d8d0bc", x - sw / 2, sy + sh2 - 1, sw, 1); if (st >= 2 && r === 0) { R("#b8322a", x - 1, sy + 2, 2, sh2 - 4); R("#b8322a", x - 4, sy + sh2 / 2 - 1, 8, 2); } } }
    if (k === 0) { const w = Math.sin(now / 300) > 0 ? 1 : 0; R("#b8322a", x + 1, top - 4, 6 + w, 3); }
  });
  requestAnimationFrame(draw);
}
size(); addEventListener("resize", size); render(); requestAnimationFrame(draw);
</script>
</body>
</html>
