<!doctype html>
<html lang="de">
<head>

<style>
:root { --ink: #2b1d12; --parch: #f1e4c4; --blood: #8e2a1c; --gold: #c9973c; --sea: #1f76b5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0f5; font: 15px/1.35 "IM Fell English", Georgia, serif; color: var(--ink); }
#world { position: fixed; inset: 0; touch-action: none; }
#world canvas { width: 100%; height: 100%; display: block; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lb { position: absolute; transform: translate(-50%, -100%); text-align: center; white-space: nowrap; color: #fff; text-shadow: 0 1px 2px #000, 0 0 6px rgba(0,0,0,0.6); }
.lb b { display: block; font: 700 15px "IM Fell English", serif; }
.lb i { display: block; font: italic 11px "IM Fell English", serif; color: #ffe9b8; }
.lb.pc b { color: #ffd76a; }
.lb.sight b { font-style: italic; color: #ffe9b8; }
/* HUD, after the old pirate games: a quest scroll, a compass medallion, buttons */
.quest {
  position: fixed; left: 10px; top: max(10px, env(safe-area-inset-top)); max-width: calc(100% - 80px); display: flex; align-items: center; gap: 8px;
  background: linear-gradient(#2a6fa8, #1d4f7c); border: 2px solid #d9b56e; border-radius: 22px; padding: 6px 14px 6px 8px; color: #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,0.35);
}
.quest .ic { width: 30px; height: 30px; border-radius: 50%; background: #f1e4c4; display: grid; place-items: center; font-size: 17px; flex: 0 0 auto; }
.quest b { display: block; font: 800 13px "Cinzel", serif; letter-spacing: 0.06em; }
.quest span { font-size: 14px; }
.back { position: fixed; right: 10px; top: max(10px, env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: #f1e4c4; border: 2px solid #d9b56e; color: var(--ink); text-decoration: none; font-size: 24px; box-shadow: 0 3px 10px rgba(0,0,0,0.35); }
.medal {
  position: fixed; left: 8px; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 8px; pointer-events: none;
}
.rose { width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle, #f6ead0 0 56%, #2a6fa8 57% 70%, #d9b56e 71% 74%, #1d4f7c 75%);
  box-shadow: 0 3px 12px rgba(0,0,0,0.4); position: relative; pointer-events: auto; }
.rose svg { position: absolute; inset: 0; transition: transform 0.15s; }
.who { display: flex; flex-direction: column; gap: 4px; }
.who div { background: linear-gradient(#2a6fa8, #1d4f7c); border: 2px solid #d9b56e; border-radius: 16px; color: #fff; padding: 3px 12px; font: 600 14px "IM Fell English", serif; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
.who .nm { font: 800 14px "Cinzel", serif; }
.date { position: fixed; left: 108px; bottom: max(6px, env(safe-area-inset-bottom)); color: #fff; font: italic 13px "IM Fell English", serif; text-shadow: 0 1px 3px #000; display: none; }
.pad { position: fixed; right: 8px; bottom: max(10px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(2, 54px); gap: 6px; }
.pad button {
  height: 54px; border-radius: 10px; border: 2px solid #d9b56e; background: linear-gradient(#2a6fa8, #1d4f7c); color: #fff; font: 700 11px "Figtree", sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.35);
}
.pad button span, .pad a span { font-size: 20px; line-height: 1; }
.pad.side { top: calc(max(10px, env(safe-area-inset-top)) + 54px); bottom: auto; grid-template-columns: 54px; }
.pad a { height: 54px; border-radius: 10px; border: 2px solid #d9b56e; background: linear-gradient(#8a5a2a, #5a3816); color: #fff; font: 700 11px "Figtree", sans-serif; text-decoration: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; box-shadow: 0 3px 8px rgba(0,0,0,0.35); }
.pad button.on { background: linear-gradient(#e2b54d, #b98a2a); color: var(--ink); }
#pcBtn { font-size: 18px; }
#toast {
  position: fixed; left: 50%; top: 70px; transform: translateX(-50%); max-width: 92%; background: rgba(241,228,196,0.96); border: 2px solid #d9b56e; border-radius: 10px;
  padding: 8px 14px; font-size: 15px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
}
#src { position: fixed; left: 14px; top: calc(max(10px, env(safe-area-inset-top)) + 58px); font: 10px "Figtree", sans-serif; color: rgba(255,255,255,0.85); text-shadow: 0 0 3px #000; pointer-events: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: #1c140c url("../strand.jpg") center / cover; color: #fff; font: italic 22px "IM Fell English", serif; text-shadow: 0 2px 8px #000; z-index: 50; }
</style>

<div id="world"></div>

    <text y="-33" text-anchor="middle" font-family="Cinzel" font-weight="800" font-size="10" fill="#fff">N</text></g></svg></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../avatar.js"></script>
<script src="../postcards.js"></script>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const toast = (t, ms = 4000) => { const e = $("#toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.tm); toast.tm = setTimeout(() => { e.hidden = true; }, ms); };

/* ---------------- Coordinates ----------------
   One unit is one kilometre: x east, z south, y up, from 27.55° E / 36.52° N. Heights are drawn
   1.6 times taller than they are, so the mountains read from above. */
const LON0 = 27.55, LAT0 = 36.52, KM = 111.32, KX = Math.cos(36.17 * Math.PI / 180), EXAG = 1.6;
const P = (lon, lat) => [(lon - LON0) * KM * KX, (LAT0 - lat) * KM];
const unP = (x, z) => [LAT0 - z / KM, LON0 + x / (KM * KX)];
const distKm = (a, b) => { const R = 6371, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

/* ---------------- Noise for hills and woods ---------------- */
function hash(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, z) => vnoise(x, z) * 0.5 + vnoise(x * 2.1, z * 2.1) * 0.27 + vnoise(x * 4.3, z * 4.3) * 0.15 + vnoise(x * 8.7, z * 8.7) * 0.08;

/* ---------------- The land ---------------- */
// the real summits of Rhodes: [lon, lat, height km, radius km]
const PEAKS = [[27.86, 36.2, 1.2, 4.5], [27.79, 36.14, 0.8, 3.5], [27.94, 36.27, 0.79, 3.5], [28.05, 36.3, 0.42, 5], [27.9, 36.06, 0.45, 6],
  [27.84, 35.98, 0.35, 5], [28.0, 36.18, 0.4, 4], [28.087, 36.093, 0.12, 0.8], [28.14, 36.24, 0.3, 2]];
const W0 = -6, W1 = 76, D0 = -6, D1 = 84, CELL = 0.34;
/* The coast and the land are kept apart. The land (hills, woods, towns) is a coarse grid and may be
   rough; where land ends is decided only by the coast data (geo/, from OpenStreetMap): its SVG paths
   are drawn into a mask, and the mask cuts the land exactly at the shore, paints the beach and lights
   the shallows. Mask: R = land, G = beach, B = near the coast (for the turquoise water). */
const MRES = 0.03;                         // 30 m per mask pixel
const MW = Math.round((W1 - W0) / MRES), MH = Math.round((D1 - D0) / MRES);
let MASK = null, maskTex = null;
function drawMask(features, roads = []) {
  const cv = document.createElement("canvas"); cv.width = MW; cv.height = MH;
  const c = cv.getContext("2d");
  c.fillStyle = "#000"; c.fillRect(0, 0, MW, MH);
  // from path units (1e-5 degree, y = -latitude) straight to mask pixels
  const to = () => c.setTransform(KM * KX / MRES / 1e5, 0, 0, KM / MRES / 1e5, (-LON0 * KM * KX - W0) / MRES, (LAT0 * KM - D0) / MRES);
  const paths = features.map((f) => new Path2D(f.d));
  c.globalCompositeOperation = "lighter";
  // B: the shallows, a soft glow around every coast (drawn small and blurred, then laid over)
  const sm = document.createElement("canvas"); sm.width = Math.ceil(MW / 4); sm.height = Math.ceil(MH / 4);
  const s4 = sm.getContext("2d"); s4.globalCompositeOperation = "lighter";
  for (const [blur, a] of [[1.5, 0.6], [6, 0.5]]) {
    s4.save(); s4.filter = `blur(${blur}px)`; s4.setTransform(KM * KX / MRES / 4e5, 0, 0, KM / MRES / 4e5, (-LON0 * KM * KX - W0) / MRES / 4, (LAT0 * KM - D0) / MRES / 4);
    s4.fillStyle = `rgba(0,0,255,${a})`; for (const p of paths) s4.fill(p); s4.restore();
  }
  c.imageSmoothingEnabled = true; c.drawImage(sm, 0, 0, MW, MH);
  // R: land, exactly
  c.save(); to(); c.fillStyle = "#f00"; for (const p of paths) c.fill(p); c.restore();
  // G: the beach, a band along the shoreline (only its land half shows)
  c.save(); to(); c.strokeStyle = "#0f0"; c.lineWidth = 40; c.lineJoin = "round"; for (const p of paths) c.stroke(p); c.restore();
  // main roads: the green channel at about two thirds, so they read apart from the beach
  c.save(); to(); c.globalCompositeOperation = "source-over"; c.lineCap = "round"; c.lineJoin = "round";
  for (const r of roads) {
    c.lineWidth = { primary: 70, secondary: 50, tertiary: 34 }[r.class] || 34;
    c.strokeStyle = "rgba(0,0,0,0)";
    // draw into G only: keep R (land) and B (shallows) as they are
    c.globalCompositeOperation = "lighter"; c.strokeStyle = "rgb(0,150,0)"; c.stroke(new Path2D(r.d));
  }
  c.restore();
  const img = c.getImageData(0, 0, MW, MH).data;
  MASK = new Uint8Array(MW * MH * 2);
  for (let i = 0, j = 0; i < img.length; i += 4, j += 2) { MASK[j] = img[i]; MASK[j + 1] = img[i + 1]; }
  maskTex = new THREE.CanvasTexture(cv);
  maskTex.generateMipmaps = false; maskTex.minFilter = THREE.LinearFilter; maskTex.magFilter = THREE.LinearFilter;
  maskTex.wrapS = maskTex.wrapT = THREE.ClampToEdgeWrapping;
}
const mpx = (x, z) => { const i = Math.floor((x - W0) / MRES), j = Math.floor((z - D0) / MRES); return i >= 0 && j >= 0 && i < MW && j < MH ? (j * MW + i) * 2 : -1; };
const isLand = (x, z) => { const k = mpx(x, z); return k >= 0 && MASK[k] > 127; };
const isBeach = (x, z) => { const k = mpx(x, z); return k >= 0 && MASK[k] > 127 && MASK[k + 1] > 60; };
// both land and sea floor read the mask in their shaders
function withMask(material, frag) {
  material.onBeforeCompile = (sh) => {
    sh.uniforms.uMask = { value: maskTex };
    sh.uniforms.uMaskBox = { value: new THREE.Vector4(W0, D0, W1 - W0, D1 - D0) };
    sh.vertexShader = "varying vec2 vMaskUv;\nuniform vec4 uMaskBox;\n" + sh.vertexShader.replace("#include <worldpos_vertex>",
      "#include <worldpos_vertex>\nvec4 mwp = modelMatrix * vec4(transformed, 1.0);\nvMaskUv = vec2((mwp.x - uMaskBox.x) / uMaskBox.z, 1.0 - (mwp.z - uMaskBox.y) / uMaskBox.w);");
    sh.fragmentShader = "varying vec2 vMaskUv;\nuniform sampler2D uMask;\n" + sh.fragmentShader.replace("#include <color_fragment>", "#include <color_fragment>\n" + frag);
  };
  return material;
}
let NX, NZ, H, LAND, DIST;
function heightAt(x, z) {
  // bilinear from the grid
  const gx = clamp((x - W0) / CELL, 0, NX - 1.001), gz = clamp((z - D0) / CELL, 0, NZ - 1.001), i = Math.floor(gx), j = Math.floor(gz), fx = gx - i, fz = gz - j;
  const h = (a, b) => H[b * NX + a];
  return h(i, j) * (1 - fx) * (1 - fz) + h(i + 1, j) * fx * (1 - fz) + h(i, j + 1) * (1 - fx) * fz + h(i + 1, j + 1) * fx * fz;
}
function buildLand(features, roads) {
  drawMask(features, roads);
  NX = Math.ceil((W1 - W0) / CELL) + 1; NZ = Math.ceil((D1 - D0) / CELL) + 1;
  H = new Float32Array(NX * NZ); LAND = new Uint8Array(NX * NZ); DIST = new Float32Array(NX * NZ);
  // land at each grid point (any land within half a cell, so the grid always reaches past the true coast)
  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const x = W0 + i * CELL, z = D0 + j * CELL; let l = 0;
    for (const [ox, oz] of [[0, 0], [-0.17, 0], [0.17, 0], [0, -0.17], [0, 0.17]]) if (isLand(x + ox, z + oz)) { l = isLand(x, z) ? 2 : 1; if (l === 2) break; }
    LAND[j * NX + i] = l;
  }
  // distance to the coast in cells (two-pass chamfer), inland and out to sea
  const INF = 1e6, din = new Float32Array(NX * NZ), dout = new Float32Array(NX * NZ);
  for (let k = 0; k < NX * NZ; k++) { din[k] = LAND[k] === 2 ? INF : 0; dout[k] = LAND[k] ? 0 : INF; }
  for (const d of [din, dout]) {
    for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) { const k = j * NX + i; if (i) d[k] = Math.min(d[k], d[k - 1] + 1); if (j) d[k] = Math.min(d[k], d[k - NX] + 1); if (i && j) d[k] = Math.min(d[k], d[k - NX - 1] + 1.414); if (j && i < NX - 1) d[k] = Math.min(d[k], d[k - NX + 1] + 1.414); }
    for (let j = NZ - 1; j >= 0; j--) for (let i = NX - 1; i >= 0; i--) { const k = j * NX + i; if (i < NX - 1) d[k] = Math.min(d[k], d[k + 1] + 1); if (j < NZ - 1) d[k] = Math.min(d[k], d[k + NX] + 1); if (i < NX - 1 && j < NZ - 1) d[k] = Math.min(d[k], d[k + NX + 1] + 1.414); if (i && j < NZ - 1) d[k] = Math.min(d[k], d[k + NX - 1] + 1.414); }
  }
  const peaks = PEAKS.map(([lon, lat, h, r]) => [...P(lon, lat), h, r]);
  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const x = W0 + i * CELL, z = D0 + j * CELL, k = j * NX + i, d = din[k] * CELL;
    let h = 0.012 + 0.18 * smooth(0, 2.5, d);
    for (const [px, pz, ph, pr] of peaks) { const q = ((x - px) ** 2 + (z - pz) ** 2) / (pr * pr); if (q < 9) h += ph * Math.exp(-q) * smooth(0, 1.2, d); }
    h += (fbm(x * 0.35, z * 0.35) - 0.45) * 0.22 * smooth(0, 1.5, d);
    H[k] = LAND[k] ? Math.max(0.0015, h * smooth(0, 0.6, d)) * EXAG : -Math.min(0.25, 0.01 + dout[k] * CELL * 0.05);
    DIST[k] = LAND[k] ? d : dout[k] * CELL;
  }
  const grid = (heights, colorOf) => {
    const geo = new THREE.PlaneGeometry((NX - 1) * CELL, (NZ - 1) * CELL, NX - 1, NZ - 1);
    geo.rotateX(-Math.PI / 2); geo.translate(W0 + (NX - 1) * CELL / 2, 0, D0 + (NZ - 1) * CELL / 2);
    const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
    for (let v = 0; v < pos.count; v++) {
      const x = pos.getX(v), z = pos.getZ(v), k = clamp(Math.round((z - D0) / CELL), 0, NZ - 1) * NX + clamp(Math.round((x - W0) / CELL), 0, NX - 1);
      pos.setY(v, heights(k)); colorOf(c, k, x, z); col[v * 3] = c.r; col[v * 3 + 1] = c.g; col[v * 3 + 2] = c.b;
    }
    geo.setAttribute("color", new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals(); return geo;
  };
  // the land: cut at the true coast, beach painted along it
  const landGeo = grid((k) => (LAND[k] ? H[k] : 0.0024), (c, k, x, z) => {
    const h = H[k], n = fbm(x * 0.8, z * 0.8);
    if (h > 1.45 * EXAG / 1.6) c.set("#c2b296"); else if (h > 1.0) c.set(n > 0.5 ? "#8e7d5e" : "#9a8a68");
    else c.set(n > 0.56 ? "#3f7a34" : n > 0.45 ? "#5f9445" : "#8eaa5a");
  });
  const land = new THREE.Mesh(landGeo, withMask(new THREE.MeshLambertMaterial({ vertexColors: true }),
    "vec4 mk = texture2D(uMask, vMaskUv);\nif (mk.r < 0.5) discard;\nfloat road = smoothstep(0.2, 0.45, mk.g) * (1.0 - smoothstep(0.62, 0.8, mk.g));\nfloat beach = smoothstep(0.7, 0.9, mk.g);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.86, 0.80, 0.68), road);\ndiffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.92, 0.85, 0.65), beach);"));
  scene.add(land);
  /* the sea floor: shallow and plain. The turquoise of the shallows is painted on the water's surface
     (see water below), not down here: seen at a slant through the water, a coloured floor deep below
     slid away from the coast and the island seemed to float above its own shadow. */
  const seaGeo = grid((k) => -Math.min(0.25, 0.01 + (LAND[k] ? 0 : DIST[k]) * 0.05), (c) => c.set("#1f5f96"));
  const sea = new THREE.Mesh(seaGeo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  scene.add(sea);
  water.material = withMask(new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, shininess: 90, specular: 0x9fdcff }),
    "vec4 mk = texture2D(uMask, vMaskUv);\nfloat sh = clamp(mk.b * 1.4, 0.0, 1.0);\ndiffuseColor.rgb = mix(vec3(0.13, 0.48, 0.78), vec3(0.47, 0.89, 0.85), sh);\ndiffuseColor.a = mix(0.9, 0.72, sh);");
  return land;
}

/* ---------------- Scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
$("#world").append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#8fd0f5");
scene.fog = new THREE.Fog("#a9dcf5", 30, 120);
const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 400);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6a8a6a, 0.75));
const sun = new THREE.DirectionalLight(0xfff2dc, 0.8); sun.position.set(-30, 60, 20); scene.add(sun);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }

// the sea: a glassy sheet over the coloured sea floor, so the shallows shine turquoise

    const dx = pl.tx - pl.x, dz = pl.tz - pl.z, d = Math.hypot(dx, dz);
    const speed = aura.on ? Math.max(0.06, d * 0.8) : gps.on && gps.onIsland ? Math.max(0.004, d * 1.5) : 0.025;     // km per second
    if (d > 0.002) { const st = Math.min(d, speed * dt); pl.x += (dx / d) * st; pl.z += (dz / d) * st; pl.face = Math.atan2(dx, dz); pl.walk = Math.min(1, pl.walk + dt * 3); }
    else { pl.tx = null; tgtMark.visible = false; }
  } else pl.walk = Math.max(0, pl.walk - dt * 3);
  const y = Math.max(0, heightAt(pl.x, pl.z));
  if (avatar) { avatar.g.position.set(pl.x, y, pl.z); avatar.g.rotation.y = pl.face; avatar.update(dt, pl.walk); }
  ring.position.set(pl.x, y + 0.002, pl.z); ring.scale.setScalar(1 + Math.sin(now / 300) * 0.08);
  if (document.querySelector("#kampf")) { requestAnimationFrame(loop); return; }      // the world holds still while you fight
  auraStep(now, y); dogStep(dt); porthosStep(now); jobsStep(now);
  if (now - (loop.s || 0) > 5000) { loop.s = now; const s = window.Spiel.get(); s.pos = [pl.x, pl.z]; window.Spiel.save(s); }
  if (aura.on && now - (loop.a || 0) > 1000 && !busy()) { loop.a = now; window.Postcards.check(here()); }
  for (const sh of ships) shipStep(sh, dt);
  panStep(dt); placeCamera(); renderer.render(scene, camera); drawLabels();
  if (now - (loop.q || 0) > 1000) { loop.q = now; quest(); }
  requestAnimationFrame(loop);
}
window.CrusadersGeo.load().then((geo) => {

  const feats = geo.features.filter((f) => f.quality === "genau" || !f.rings.every((ring) => ring.every(([lon, lat]) => exact.some(([a, b, c, d]) => lon >= a && lon <= c && lat >= b && lat <= d))));
  TOWNS = geo.regions.flatMap((r) => (r.data.places || []).map((p) => [p.name, p.lat, p.lon, ...(SIZE[p.kind] || SIZE.village)]));
  terrain = buildLand(feats, geo.roads);
  $("#src").textContent = "Küste © OpenStreetMap-Mitwirkende (ODbL) · Natural Earth";
  landmarks(geo.landmarks); trees(); towns(); wreck(); seaLanes(geo.lanes);
  for (const [name, lat, lon] of TOWNS) { const [x, z] = P(lon, lat); label(name, "", x, z); }
  for (const r of geo.regions) for (const st of r.data.sights || []) { const [x, z] = P(st.lon, st.lat); label(st.name, st.sub, x, z, "sight"); }
  for (const s of window.Postcards.spots) if (s.kind === "postkarte") { const [x, z] = P(s.lon, s.lat); label("✉", "", x + 0.15, z, "pc"); }
  makeAvatar();
  [pl.x, pl.z] = WRECK;
  { const sp = window.Spiel.get().pos; if (sp && isLand(sp[0], sp[1])) [pl.x, pl.z] = sp; }      // where you left off
  window.Staedte.init({ places: TOWNS.map(([name, lat, lon]) => ({ name, lat, lon })), where: here, landNear, toast,
    changed: () => { syncJobs(); hud(); },
    focus: (j) => { if (!j) return; const [x, z] = P(j.lon, j.lat); pan.x = x - pl.x; pan.z = z - pl.z; camDist = Math.max(camDist, Math.min(30, Math.hypot(pan.x, pan.z) * 0.8)); } });

  auraSet(aura.on); if (window.Spiel.get().party.includes("porthos")) makeDog(); porthosSpawn(false); hud();
  $("#whoName").textContent = ME ? ME.name + " von " + ME.von[0] : "Generica";
  const d = new Date(); $(".date").textContent = `${d.getDate()}. ${["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"][d.getMonth()]} Anno Domini 1310`;
  $("#loading").hidden = true;
