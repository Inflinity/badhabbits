const ACTS = [
  [0, "Vor 4,5 Milliarden Jahren", "Die junge Erde glüht."],
  [3.2, "Fels und Silikat erstarren", "Eine Kruste bildet sich, Gebirge falten sich auf."],
  [9.5, "Kalk, Sandstein, Mergel", "Nackter Fels, kein Halm, kein Tropfen."],
  [13, "Wasserdampf regnet ab", "Das Meer steigt."],
  [20.5, "Das Leben färbt das Land", ""],
];
let gen = null;
const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
function genesis() {
  gen = { t: 0, act: -1, cov: U.uCloudCov.value || 0.35, cam: { ...cam } };
  cam.dist = 135; cam.pitch = 0.5; cam.x = 40; cam.z = 36; flying = false; $("#bFlug").classList.remove("on");
  U.uSea.value = 0; sea.visible = true; skirt.visible = true; $("#info").textContent = "";
}
function genEnd() {
  if (!gen) return;
  U.uHeat.value = 0; U.uGrow.value = 1; U.uLevel.value = 0; U.uShadowK.value = 1; U.uLife.value = life; U.uVeg.value = veg; U.uCloudCov.value = gen.cov;
  U.uSea.value = 1; sea.visible = true; skirt.visible = false; $("#bMeer").classList.add("on");
  $("#cap").classList.remove("on"); gen = null; light();
}
function genStep(dt) {
  const g = gen; g.t += dt; const t = g.t;
  const act = ACTS.reduce((a, x, i) => (t >= x[0] ? i : a), 0);
  if (act !== g.act) { g.act = act; const c = $("#cap"); c.classList.remove("on"); setTimeout(() => { if (!gen) return; c.innerHTML = `${ACTS[act][1]}<small>${ACTS[act][2]}</small>`; c.classList.add("on"); }, act ? 500 : 0); }
  U.uHeat.value = 1 - 0.72 * ease((t - 2) / 7) - 0.28 * ease((t - 8.5) / 3.5);
  U.uGrow.value = 0.08 + 0.92 * ease((t - 2.5) / 7.5);
  U.uShadowK.value = ease((t - 9) / 2);
  U.uLevel.value = BOTTOM * (1 - ease((t - 13) / 7.5));
  U.uCloudCov.value = g.cov * ease((t - 14) / 6);
  U.uLife.value = life * ease((t - 21) / 4); U.uVeg.value = veg * ease((t - 21) / 4);
  cam.yaw += dt * 0.045; cam.dist = 135 - 40 * ease(t / 24);
  light();
  if (t > 26) genEnd();
}
el.addEventListener("pointerdown", () => { if (gen && gen.t > 0.5) genEnd(); });

/* ---------------- Weather: the real cloud cover over Rhodes ---------------- */
async function weather() {
  if (q.get("wolken")) { U.uCloudCov.value = clamp(parseFloat(q.get("wolken")), 0, 1); return; }
  try { const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=36.2&longitude=28.0&current=cloud_cover,wind_speed_10m,wind_direction_10m");
    const c = (await r.json()).current; U.uCloudCov.value = clamp(0.12 + (c.cloud_cover / 100) * 0.6, 0.12, 0.75); wind = [c.wind_speed_10m, c.wind_direction_10m]; } catch (e) {}
}
let wind = [15, 300];

/* ---------------- Start ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (flying) { cam.yaw += dt * 0.035; }
  if (gen) genStep(dt);
  U.uTime.value = now / 1000;
  const wr = (wind[1] * Math.PI) / 180, ws = (wind[0] / 3600) * 6 / 22;      // clouds drift with the real wind, a little faster
  U.uCloudOff.value.x += -Math.sin(wr) * ws * dt; U.uCloudOff.value.y -= Math.cos(wr) * ws * dt;
  place(); U.uCam.value.copy(camera.position);
  sea.position.set(camera.position.x, U.uLevel.value, camera.position.z); clouds.position.set(camera.position.x, U.uCloudH.value, camera.position.z); sky.position.copy(camera.position);
  U.uHaze.value = 0.02 * (1 + U.uHeat.value);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
(async () => {
  const [geo, sat] = await Promise.all([window.CrusadersGeo.load(), new THREE.TextureLoader().loadAsync("data/natur.jpg"), loadHeights()]);
  const exact = geo.regions.filter((r) => r.quality === "genau").map((r) => r.bbox);
  const feats = geo.features.filter((f) => f.quality === "genau" || !f.rings.every((ring) => ring.every(([lon, lat]) => exact.some(([a, b, c, d]) => lon >= a && lon <= c && lat >= b && lat <= d))));
  drawMask(feats); coastDist(); buildRelief();
  sat.encoding = THREE.sRGBEncoding; sat.anisotropy = renderer.capabilities.getMaxAnisotropy();
  U.uMask.value = maskTex; U.uRelief.value = reliefTex; U.uNormal.value = normalTex; U.uDist.value = distTex; U.uCloud.value = cloudNoise(); U.uSat.value = sat;
  U.uGeo.value = geoTex; U.uShadow.value = shadowTex;
  terrain(); cutSides(); seaSurface(); cloudLayer(); light(); weather();
  setInterval(light, 60000);
  if (q.get("ziel")) { const [lon, lat, dist, yaw, pitch] = q.get("ziel").split(",").map(Number); [cam.x, cam.z] = P(lon, lat); if (dist) cam.dist = dist; if (yaw != null && !isNaN(yaw)) cam.yaw = yaw; if (pitch) cam.pitch = pitch; }
  showLayer();
  $("#loading").hidden = true;
  if (q.get("genesis") !== "0" && !q.get("ziel")) genesis();
  requestAnimationFrame(loop);
})();
</script>
