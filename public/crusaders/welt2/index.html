<script>
"use strict";
/* Mundi II: the island as if seen from a plane. Not drawn, measured:
   - heights from a real elevation model, land and sea floor (down to −4200 m in the Rhodes basin),

   - the land coloured by a cloud-free satellite mosaic

/* ---------------- Heights: land and sea floor, in metres ---------------- */

  const c = cv.getContext("2d"); c.drawImage(img, 0, 0); const d = c.getImageData(0, 0, HW, HH).data;
  HM = new Float32Array(HW * HH); for (let i = 0; i < HW * HH; i++) HM[i] = d[i * 4] * 256 + d[i * 4 + 1] - 10000;

  for (let k = 0; k < CD.length; k++) CD[k] = Math.max(0, CD[k] - 0.5) * MRES * CR;

  const cv = document.createElement("canvas"); cv.width = CW; cv.height = CH; const c = cv.getContext("2d"), im = c.createImageData(CW, CH);
  for (let k = 0; k < CD.length; k++) { im.data[k * 4] = land[k] ? 0 : Math.sqrt(Math.min(1, CD[k] / 2)) * 255; im.data[k * 4 + 3] = 255; }
  c.putImageData(im, 0, 0); distTex = new THREE.CanvasTexture(cv); distTex.generateMipmaps = false; distTex.minFilter = distTex.magFilter = THREE.LinearFilter;
}
let distTex = null;
const cdAt = (x, z) => CD[clamp(Math.floor((z - D0) / (MRES * CR)), 0, CH - 1) * CW + clamp(Math.floor((x - W0) / (MRES * CR)), 0, CW - 1)];

// relief texture for the shaders: R land height, G depth (square-root scale), and the surface normals
let reliefTex = null, normalTex = null;
function buildRelief() {
  const a = document.createElement("canvas"), b = document.createElement("canvas"); a.width = b.width = HW; a.height = b.height = HH;
  const ia = a.getContext("2d").createImageData(HW, HH), ib = b.getContext("2d").createImageData(HW, HH);
  const dx = (WX / HW) * 1000, dz = (DZ / HH) * 1000;
  for (let j = 0; j < HH; j++) for (let i = 0; i < HW; i++) {
    const k = j * HW + i, h = HM[k], ex = h > 0 ? EX_LAND : EX_SEA;
    const hx = (HM[j * HW + Math.min(HW - 1, i + 1)] - HM[j * HW + Math.max(0, i - 1)]) / (2 * dx) * ex, hz = (HM[Math.min(HH - 1, j + 1) * HW + i] - HM[Math.max(0, j - 1) * HW + i]) / (2 * dz) * ex;

  const oct = [[4, 0.5, g(4)], [8, 0.25, g(8)], [16, 0.14, g(16)], [32, 0.07, g(32)], [64, 0.04, g(64)]];
  const sm = (t) => t * t * (3 - 2 * t);

    for (const [s, w, a] of oct) { const fx = (x / N) * s, fy = (y / N) * s, i = Math.floor(fx), j = Math.floor(fy), u = sm(fx - i), t = sm(fy - j), I = (i + 1) % s, J = (j + 1) % s;

  const L = (qq + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * r, e = (23.439 - 0.00000036 * d) * r;
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L)), dec = Math.asin(Math.sin(e) * Math.sin(L));

  const east = -Math.cos(dec) * Math.sin(H), north = Math.sin(dec) * Math.cos(lat) - Math.cos(dec) * Math.cos(H) * Math.sin(lat);

const TIMES = [["Echtzeit", null], ["Morgen", 8.5], ["Mittag", 12.5], ["Abend", 17.2]];
let timeIdx = q.get("zeit") ? -1 : 0;
function sunDir() {
  const d = new Date(), h = timeIdx < 0 ? parseFloat(q.get("zeit")) : TIMES[timeIdx][1];

/* ---------------- Shaders ---------------- */
const COMMON = `

const U = {
  uSun: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color(1, 1, 1) }, uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uCam: { value: new THREE.Vector3() },
  uTime: { value: 0 }, uHaze: { value: 0.006 }, uCloudCov: { value: 0.38 }, uCloudH: { value: 4.8 }, uClouds: { value: 1 }, uSea: { value: 1 },
  uMask: { value: null }, uRelief: { value: null }, uNormal: { value: null }, uCloud: { value: null }, uDist: { value: null }, uSat: { value: null },
  uBox: { value: new THREE.Vector4(W0, D0, WX, DZ) }, uCloudOff: { value: new THREE.Vector2() },
};

/* ---------------- Scene ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(1.5, devicePixelRatio || 1));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputEncoding = THREE.sRGBEncoding;
$("#world").append(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(45, 1, 0.05, 2500);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

function terrain() {
  const NX = 330, NZ = 362, pos = new Float32Array(NX * NZ * 3), uvs = new Float32Array(NX * NZ * 2), idx = [];
  for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) {
    const x = W0 + (i / (NX - 1)) * WX, z = D0 + (j / (NZ - 1)) * DZ, k = j * NX + i;
    pos[k * 3] = x; pos[k * 3 + 1] = yAt(x, z); pos[k * 3 + 2] = z; uvs[k * 2] = (x - W0) / WX; uvs[k * 2 + 1] = 1 - (z - D0) / DZ;
    if (i < NX - 1 && j < NZ - 1) idx.push(k, k + NX, k + 1, k + 1, k + NX, k + NX + 1);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(idx), 1));
  const m = new THREE.Mesh(g, shader(`
    uniform sampler2D uSat; uniform float uSea;
    void main() {
      vec4 mk = texture2D(uMask, vUv); float land = step(0.5, mk.r);
      vec2 nn = texture2D(uNormal, vUv).rg * 2.0 - 1.0; vec3 N = normalize(vec3(nn.x, sqrt(max(0.0, 1.0 - dot(nn, nn))), nn.y));
      float sh = cloudShadow(vP), diff = max(dot(N, uSun), 0.0);
      vec3 V = normalize(uCam - vP), col;
      if (land > 0.5) {
        vec3 sat = pow(texture2D(uSat, vUv).rgb, vec3(2.2)) * 1.25;
        col = sat * (uSunCol * (0.25 + 1.1 * diff) * sh + uZen * 0.28);
      } else if (uSea > 0.5) {
        discard;      // the sea plane draws the water, flat, at sea level
      } else {
        // the sea floor, when the water is switched off: tinted by depth like a relief globe, light shelf, ink-blue deep
        float dn = texture2D(uRelief, vUv).g;
        vec3 fl = mix(vec3(0.46, 0.62, 0.68), vec3(0.13, 0.28, 0.48), smoothstep(0.02, 0.35, dn));
        fl = mix(fl, vec3(0.03, 0.08, 0.2), smoothstep(0.35, 0.9, dn));
        float steep = 1.0 - N.y;
        col = fl * (uSunCol * (0.12 + 1.15 * diff) * sh + uZen * 0.22) * (1.0 - steep * 0.5);
      }
      gl_FragColor = vec4(haze(col, vP), 1.0);
      ${TAIL}
    }`));
  m.material.uniforms.uSat = U.uSat;
  scene.add(m); return m;
}
// without the water the map is a cut block, like a relief model: its sides show the section through the earth
let skirt = null;
function cutSides() {
  const pos = [], col = [], N = 160, BOT = -12, edge = (t, k) => [[W0 + t * WX, D0], [W1, D0 + t * DZ], [W1 - t * WX, D1], [W0, D1 - t * DZ]][k];
  for (let k = 0; k < 4; k++) for (let i = 0; i < N; i++) {
    const [ax, az] = edge(i / N, k), [bx, bz] = edge((i + 1) / N, k), ay = yAt(ax, az), by = yAt(bx, bz);
    pos.push(ax, ay, az, ax, BOT, az, bx, by, bz, bx, by, bz, ax, BOT, az, bx, BOT, bz);
    const top = (y) => (y > 0 ? [0.42, 0.34, 0.26] : [0.3, 0.28, 0.27]), lo = [0.1, 0.09, 0.09];
    col.push(...top(ay), ...lo, ...top(by), ...top(by), ...lo, ...lo);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  skirt = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })); skirt.visible = false; scene.add(skirt);
}
// the sea surface over everything that is not land; beyond the map it goes on to the horizon
let sea = null;
function seaSurface() {
  sea = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shader(`
    void main() {
      vec2 uv = boxUv(vP.xz); float inside = inBox(uv);
      vec4 mk = inside > 0.5 ? texture2D(uMask, uv) : vec4(0.0);
      if (mk.r > 0.5) discard;
      float sd = inside > 0.5 ? shoreAt(uv) : 5000.0, d = inside > 0.5 ? depthAt(uv, sd, vP.xz) : 1500.0;
      vec3 V = normalize(uCam - vP);
      vec3 col = waterCol(vP, d, sd, waves(vP.xz, length(uCam - vP) / max(V.y, 0.1)), V, cloudShadow(vP));
      gl_FragColor = vec4(haze(col, vP), 1.0);
      ${TAIL}
    }`));
  sea.rotation.x = -Math.PI / 2; sea.scale.set(3000, 3000, 1); scene.add(sea);
}
let clouds = null;
function cloudLayer() {
  clouds = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), shader(`
    void main() {
      float d = cloudD(vP.xz); if (d < 0.02) discard;
      // light from the side the sun is on: thin and bright there, grey and thick underneath
      float toward = cloudD(vP.xz + uSun.xz * 1.2);
      float lit = clamp(1.0 - toward * 0.55 + (d - toward) * 0.4, 0.35, 1.0);
      vec3 col = uSunCol * lit * 1.15 + uZen * 0.35;
      float under = step(vP.y, uCam.y) ;
      col *= mix(0.72, 1.0, under);
      gl_FragColor = vec4(haze(col, vP), d * 0.96);
      ${TAIL}
    }`, { transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  clouds.rotation.x = -Math.PI / 2; clouds.scale.set(600, 600, 1); scene.add(clouds);
}
const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: U,
  vertexShader: `varying vec3 vD; void main() { vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec3 vD; uniform vec3 uSun, uSunCol, uZen, uHor;
    void main() { vec3 d = normalize(vD); float h = clamp(d.y, 0.0, 1.0); vec3 col = mix(uHor, uZen, pow(h, 0.45)); if (d.y < 0.0) col = uHor;
      float s = max(dot(d, uSun), 0.0); col += uSunCol * (pow(s, 8.0) * 0.2 + pow(s, 200.0) * 0.6 + smoothstep(0.9996, 0.9999, s) * 6.0);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <encodings_fragment>
    }`,
}));
sky.renderOrder = -1; scene.add(sky);

/* ---------------- Light and colour of the hour ---------------- */
function light() {
  const s = sunDir(), e = Math.asin(s.y) * 180 / Math.PI, low = clamp((e - 2) / 25, 0, 1);
  U.uSun.value.copy(s);
  U.uSunCol.value.setRGB(1.0, 0.72 + 0.26 * low, 0.48 + 0.46 * low).multiplyScalar(0.9 + 0.5 * low);
  U.uZen.value.setRGB(0.10, 0.25, 0.55).lerp(new THREE.Color(0.18, 0.2, 0.36), 1 - low);
  U.uHor.value.setRGB(0.62, 0.74, 0.86).lerp(new THREE.Color(0.95, 0.66, 0.46), 1 - low);
}

/* ---------------- Flying: drag to move, pinch to zoom, two fingers to turn and tilt ---------------- */
const cam = { x: 40, z: 36, dist: 95, yaw: 2.6, pitch: 0.62 };
function place() {
  const ty = Math.max(0, cam.dist < 25 ? yAt(cam.x, cam.z) : 0);
  const cx = cam.x + Math.sin(cam.yaw) * Math.cos(cam.pitch) * cam.dist, cz = cam.z + Math.cos(cam.yaw) * Math.cos(cam.pitch) * cam.dist;
  let cy = ty + Math.sin(cam.pitch) * cam.dist;
  if (cx > W0 && cx < W1 && cz > D0 && cz < D1) cy = Math.max(cy, yAt(cx, cz) + 0.3);
  camera.position.set(cx, cy, cz); camera.lookAt(cam.x, ty, cam.z);
  camera.near = clamp(cam.dist * 0.004, 0.02, 2); camera.updateProjectionMatrix();
}
const el = renderer.domElement, ptrs = new Map(); let pinch = null, two = null, flying = false;
el.addEventListener("pointerdown", (e) => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); el.setPointerCapture(e.pointerId); pinch = null; two = null; flying = false; $("#bFlug").classList.remove("on"); });
el.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) {
    const k = (2 * cam.dist * Math.tan(Math.PI / 8)) / innerHeight, dx = -(e.clientX - prev[0]) * k, dy = -(e.clientY - prev[1]) * k / Math.max(0.4, Math.sin(cam.pitch));
    cam.x += Math.cos(cam.yaw) * dx + Math.sin(cam.yaw) * dy; cam.z += -Math.sin(cam.yaw) * dx + Math.cos(cam.yaw) * dy;
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    if (pinch) cam.dist = clamp(cam.dist * (pinch / d), 1.5, 400);
    if (two) { cam.yaw += ang - two.ang; cam.pitch = clamp(cam.pitch + (m[1] - two.m[1]) * 0.004, 0.12, 1.5); }
    pinch = d; two = { ang, m };
  }
});
const up = (e) => { ptrs.delete(e.pointerId); pinch = null; two = null; };
el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
el.addEventListener("wheel", (e) => { e.preventDefault(); cam.dist = clamp(cam.dist * (e.deltaY > 0 ? 1.12 : 1 / 1.12), 1.5, 400); }, { passive: false });
el.addEventListener("contextmenu", (e) => e.preventDefault());

/* ---------------- Buttons ---------------- */
$("#bFlug").onclick = () => { flying = !flying; $("#bFlug").classList.toggle("on", flying); };
$("#bZeit").onclick = () => { timeIdx = (Math.max(0, timeIdx) + 1) % TIMES.length; $("#bZeit").lastChild.textContent = TIMES[timeIdx][0]; $("#info").textContent = ""; light(); };
$("#bWolken").onclick = () => { U.uClouds.value = 1 - U.uClouds.value; $("#bWolken").classList.toggle("on", U.uClouds.value > 0.5); clouds.visible = U.uClouds.value > 0.5; };
$("#bMeer").onclick = () => { U.uSea.value = 1 - U.uSea.value; sea.visible = skirt.visible = U.uSea.value > 0.5; skirt.visible = !sea.visible; $("#bMeer").classList.toggle("on", sea.visible); $("#info").textContent = sea.visible ? "" : `Ohne Wasser: der Meeresboden, ${String(EX_SEA).replace(".", ",")}-fach überhöht, bis 4200 m tief`; };

/* ---------------- Weather: the real cloud cover over Rhodes ---------------- */
async function weather() {
  if (q.get("wolken")) { U.uCloudCov.value = clamp(parseFloat(q.get("wolken")), 0, 1); return; }
  try { const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=36.2&longitude=28.0&current=cloud_cover,wind_speed_10m,wind_direction_10m");
    const c = (await r.json()).current; U.uCloudCov.value = clamp(0.12 + (c.cloud_cover / 100) * 0.6, 0.12, 0.75); wind = [c.wind_speed_10m, c.wind_direction_10m]; } catch (e) {}
}
let wind = [15, 300];

/* ---------------- Start ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (flying) { cam.yaw += dt * 0.035; }
  U.uTime.value = now / 1000;
  const wr = (wind[1] * Math.PI) / 180, ws = (wind[0] / 3600) * 6 / 22;      // clouds drift with the real wind, a little faster
  U.uCloudOff.value.x += -Math.sin(wr) * ws * dt; U.uCloudOff.value.y -= Math.cos(wr) * ws * dt;
  place(); U.uCam.value.copy(camera.position);
  sea.position.set(camera.position.x, 0, camera.position.z); clouds.position.set(camera.position.x, U.uCloudH.value, camera.position.z); sky.position.copy(camera.position);
  U.uHaze.value = 0.02;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
(async () => {
  const [geo, sat] = await Promise.all([window.CrusadersGeo.load(), new THREE.TextureLoader().loadAsync("data/satellit.jpg"), loadHeights()]);
  const exact = geo.regions.filter((r) => r.quality === "genau").map((r) => r.bbox);
  const feats = geo.features.filter((f) => f.quality === "genau" || !f.rings.every((ring) => ring.every(([lon, lat]) => exact.some(([a, b, c, d]) => lon >= a && lon <= c && lat >= b && lat <= d))));
  drawMask(feats); coastDist(); buildRelief();
  sat.encoding = THREE.sRGBEncoding; sat.anisotropy = renderer.capabilities.getMaxAnisotropy();
  U.uMask.value = maskTex; U.uRelief.value = reliefTex; U.uNormal.value = normalTex; U.uDist.value = distTex; U.uCloud.value = cloudNoise(); U.uSat.value = sat;
  terrain(); cutSides(); seaSurface(); cloudLayer(); light(); weather();
  setInterval(light, 60000);
  if (q.get("ziel")) { const [lon, lat, dist, yaw, pitch] = q.get("ziel").split(",").map(Number); [cam.x, cam.z] = P(lon, lat); if (dist) cam.dist = dist; if (yaw != null && !isNaN(yaw)) cam.yaw = yaw; if (pitch) cam.pitch = pitch; }
  $("#loading").hidden = true;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
