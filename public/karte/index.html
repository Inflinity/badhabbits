<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a86d1">
<title>Rhodos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --sea: #2a86d1;
  --sea-deep: #1f6fb3;
  --shallow: #7cc6ee;
  --land: #e9c886;
  --land-dark: #c99a4c;
  --ink: #3b2412;
  --red: #c8321e;
  --paper: #fbf3e2;
  --gps: #0a5cff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--sea-deep); color: var(--ink); font: 15px/1.4 "Figtree", system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px) 16px;
  padding-top: max(10px, env(safe-area-inset-top)); background: var(--sea-deep); color: #fff;
}
header a { color: #fff; text-decoration: none; font-size: 26px; line-height: 1; padding: 2px 6px 4px 0; }
header h1 { margin: 0; font: 400 20px "Alfa Slab One", Georgia, serif; letter-spacing: 0.04em; }
header small { margin-left: auto; opacity: 0.8; font-size: 12px; }
#wrap { position: relative; flex: 1; overflow: hidden; touch-action: none; background: var(--sea); }
svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.place text { font: 700 1.45px "Figtree", sans-serif; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 0.45px; stroke-linejoin: round; }
.place.big text { font-size: 1.9px; }
.zoombar { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; }
.zoombar button, .locate {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink);
  font: 700 22px "Figtree", sans-serif; box-shadow: 0 3px 10px rgba(0,0,0,0.3); cursor: pointer;
}
.locate.on { background: var(--gps); color: #fff; }
#panel {
  background: var(--paper); padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -4px 16px rgba(0,0,0,0.25);
}
#panel .row { display: flex; gap: 10px; align-items: center; }
#gpsBtn {
  flex: 1; border: 0; border-radius: 14px; padding: 13px 16px; font: 700 16px "Figtree", sans-serif;
  background: var(--red); color: #fff; cursor: pointer;
}
#gpsBtn.on { background: var(--ink); }
#where { font: 400 17px "Alfa Slab One", Georgia, serif; }
#facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; font-size: 13px; }
#facts b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
#facts span { color: #7a5a3a; }
#msg { font-size: 13px; color: #7a5a3a; margin: 0; }
@keyframes pulse { 0% { r: 0.8; opacity: 0.7; } 100% { r: 3; opacity: 0; } }
#me .ring { animation: pulse 1.8s ease-out infinite; }
</style>
</head>
<body>
<header>
  <a href="/" aria-label="Zurück">‹</a>
  <h1>Rhodos</h1>
  <small id="ver">Karte v1</small>
</header>
<div id="wrap">
  <svg id="map" viewBox="0 0 70 78" aria-label="Karte von Rhodos">
    <defs>
      <pattern id="waves" width="6" height="3" patternUnits="userSpaceOnUse">
        <path d="M0 2 q1.5 -1.2 3 0 t3 0" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="0.18"/>
      </pattern>
      <radialGradient id="landShade" cx="50%" cy="45%" r="60%">
        <stop offset="0" stop-color="#d9a95c"/>

        <stop offset="1" stop-color="#f0d49a"/>
      </radialGradient>
      <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="0.6"/></filter>
    </defs>
    <g id="world">
      <rect x="-200" y="-200" width="470" height="478" fill="var(--sea)"/>
      <rect x="-200" y="-200" width="470" height="478" fill="url(#waves)"/>

      <g id="land" stroke="var(--land-dark)" stroke-width="0.25" stroke-linejoin="round"></g>
      <g id="relief"></g>
      <g id="deco"></g>
      <g id="places"></g>
      <polyline id="trail" fill="none" stroke="var(--gps)" stroke-width="0.35" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>

        <circle r="0.85" fill="var(--gps)" stroke="#fff" stroke-width="0.28"/>
      </g></g>
    </g>
  </svg>
  <div class="zoombar">
    <button type="button" id="zin" aria-label="Näher">+</button>
    <button type="button" id="zout" aria-label="Weiter weg">−</button>
    <button type="button" class="locate" id="follow" aria-label="Mir folgen">◎</button>
  </div>
</div>
<section id="panel">
  <div class="row">
    <div style="flex:1"><div id="where">Wo bist du?</div><p id="msg">Tippe auf „GPS starten“. Die Karte bleibt auf dem Handy, nur die Position kommt vom GPS.</p></div>

</section>

// Projection: kilometres east and south of 27.55 E / 36.52 N, with the longitude shrunk at this latitude.
const LON0 = 27.55, LAT0 = 36.52, KM = 111.32, KX = Math.cos(36.17 * Math.PI / 180);
const P = (lon, lat) => [(lon - LON0) * KM * KX, (LAT0 - lat) * KM];

// A smooth, hand-drawn looking outline through the coast points (Catmull-Rom as Bézier).
function smooth(pts, closed) {
  const q = pts.map(([lon, lat]) => P(lon, lat));
  const n = q.length, at = (i) => q[closed ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];
  let d = `M${q[0][0].toFixed(2)} ${q[0][1].toFixed(2)}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(2)} ${c1[1].toFixed(2)} ${c2[0].toFixed(2)} ${c2[1].toFixed(2)} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
  }
  return d + (closed ? "Z" : "");
}
const MARKS = [];   // [group, x, y]: kept the same size on screen at any zoom
function mark(x, y, parent, cls) { const g = el("g", cls ? { class: cls } : {}, parent); MARKS.push([g, x, y]); return g; }
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.append(e); return e; }

/* ---------------- Pan and zoom (one finger drags, two pinch, buttons) ---------------- */
const svg = $("#map"), wrap = $("#wrap");
let vb = { x: 6, y: 4, w: 62, h: 70 };      // the island with a little sea around it
const ME = { x: 0, y: 0 };
function fitVB() {
  const r = wrap.getBoundingClientRect(), ar = r.width / r.height;
  if (vb.w / vb.h > ar) { const h = vb.w / ar; vb.y -= (h - vb.h) / 2; vb.h = h; } else { const w = vb.h * ar; vb.x -= (w - vb.w) / 2; vb.w = w; }
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  placeMarks();
}
// marks are drawn for a 60 km wide view; zoomed in they shrink back to their size on screen
function placeMarks() {
  const k = Math.min(1.4, vb.w / 60);
  for (const [g, x, y] of MARKS) g.setAttribute("transform", `translate(${x} ${y}) scale(${k})`);
  $("#meAt").setAttribute("transform", `translate(${ME.x} ${ME.y}) scale(${Math.max(0.6, Math.min(1.4, vb.w / 30))})`);
}
function zoomAt(f, cx, cy) {
  const nw = Math.min(160, Math.max(3, vb.w / f)), k = nw / vb.w;
  vb.x = cx - (cx - vb.x) * k; vb.y = cy - (cy - vb.y) * k; vb.w = nw; vb.h *= k; fitVB();
}
const toMap = (px, py) => { const r = svg.getBoundingClientRect(); return [vb.x + (px - r.left) / r.width * vb.w, vb.y + (py - r.top) / r.height * vb.h]; };
const ptrs = new Map(); let last = null;
wrap.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); last = null; });
wrap.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) {
    const r = svg.getBoundingClientRect();
    vb.x -= (e.clientX - prev[0]) / r.width * vb.w; vb.y -= (e.clientY - prev[1]) / r.height * vb.h; fitVB(); setFollow(false);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (last) { const [cx, cy] = toMap((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); zoomAt(d / last, cx, cy); }
    last = d;
  }
});
for (const n of ["pointerup", "pointercancel"]) wrap.addEventListener(n, (e) => { ptrs.delete(e.pointerId); last = null; });
wrap.addEventListener("wheel", (e) => { e.preventDefault(); const [cx, cy] = toMap(e.clientX, e.clientY); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, cx, cy); }, { passive: false });
$("#zin").onclick = () => zoomAt(1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
$("#zout").onclick = () => zoomAt(1 / 1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
window.addEventListener("resize", fitVB);
fitVB();

const TRAIL_KEY = "rhodos-spur";
let watch = null, follow = false, fix = null, trail = [];
try { trail = JSON.parse(localStorage.getItem(TRAIL_KEY) || "[]"); } catch (e) {}
const distKm = (a, b) => { const R = 6371, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
function drawTrail() { $("#trail").setAttribute("points", trail.map(([lat, lon]) => P(lon, lat).map((v) => v.toFixed(3)).join(",")).join(" ")); }
function trailKm() { let s = 0; for (let i = 1; i < trail.length; i++) s += distKm(trail[i - 1], trail[i]); return s; }
drawTrail();
function setFollow(on) { follow = on; $("#follow").classList.toggle("on", on); if (on && fix) centre(); }
function centre() { const [x, y] = P(fix.lon, fix.lat); if (vb.w > 30) { vb.w = 24; vb.h = 24; } vb.x = x - vb.w / 2; vb.y = y - vb.h / 2; fitVB(); }
$("#follow").onclick = () => setFollow(!follow);
function nearest(lat, lon) {
  let best = null;
  for (const [name, plat, plon] of PLACES) { const d = distKm([lat, lon], [plat, plon]); if (!best || d < best.d) best = { name, d, plat, plon }; }
  return best;
}
const bearing = (a, b) => { const r = Math.PI / 180, y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r), x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r);
  return ["N", "NO", "O", "SO", "S", "SW", "W", "NW"][Math.round(((Math.atan2(y, x) / r + 360) % 360) / 45) % 8]; };
const fmt = (v, d) => v.toFixed(d).replace(".", ",");
function onFix(p) {
  const c = p.coords;
  fix = { lat: c.latitude, lon: c.longitude, acc: c.accuracy, alt: c.altitude, spd: c.speed, head: c.heading, t: p.timestamp };
  const [x, y] = P(fix.lon, fix.lat), me = $("#me");
  me.removeAttribute("hidden"); ME.x = x; ME.y = y; placeMarks();
  const acc = $("#acc"); acc.removeAttribute("hidden"); acc.setAttribute("cx", x); acc.setAttribute("cy", y); acc.setAttribute("r", Math.max(0.01, fix.acc / 1000));
  const head = me.querySelector(".head");
  if (fix.head != null && !isNaN(fix.head) && fix.spd > 0.7) { head.removeAttribute("hidden"); head.setAttribute("transform", `rotate(${fix.head})`); } else head.setAttribute("hidden", "");
  // keep a trail of good fixes, one every 15 m
  if (fix.acc < 60) {
    const lastP = trail[trail.length - 1];
    if (!lastP || distKm(lastP, [fix.lat, fix.lon]) > 0.015) { trail.push([+fix.lat.toFixed(6), +fix.lon.toFixed(6)]); if (trail.length > 5000) trail.shift(); try { localStorage.setItem(TRAIL_KEY, JSON.stringify(trail)); } catch (e) {} drawTrail(); }
  }
  $("#facts").hidden = false;
  $("#fLat").textContent = fmt(fix.lat, 5) + "°"; $("#fLon").textContent = fmt(fix.lon, 5) + "°";
  $("#fAcc").textContent = "± " + Math.round(fix.acc) + " m";
  $("#fAlt").textContent = fix.alt != null ? Math.round(fix.alt) + " m" : "–";
  $("#fSpd").textContent = fix.spd != null ? fmt(fix.spd * 3.6, 1) + " km/h" : "–";
  $("#fDist").textContent = fmt(trailKm(), 2) + " km";
  const n = nearest(fix.lat, fix.lon);
  const onIsland = fix.lat > 35.85 && fix.lat < 36.48 && fix.lon > 27.66 && fix.lon < 28.26;
  if (onIsland) {
    $("#where").textContent = n.d < 1 ? "In " + n.name : n.name + ", " + fmt(n.d, 1) + " km " + bearing([n.plat, n.plon], [fix.lat, fix.lon]);
    $("#msg").textContent = "GPS läuft. Die Ortspunkte auf der Karte sind ungefähr, dein Punkt ist echt.";
  } else {
    const d = distKm([fix.lat, fix.lon], [36.434, 28.217]);
    $("#where").textContent = "Nicht auf Rhodos";
    $("#msg").textContent = "Du bist " + fmt(d, d < 100 ? 1 : 0) + " km von Rhodos-Stadt entfernt. Der Punkt erscheint, sobald du im Kartenbereich bist.";
  }
  if (follow) centre();
}
function onErr(e) {
  const why = { 1: "Standort nicht erlaubt. Bitte in den Browser-Einstellungen für diese Seite erlauben.", 2: "Kein GPS-Signal. Am besten draußen, mit freiem Himmel.", 3: "GPS antwortet nicht, ich versuche es weiter." }[e.code] || e.message;
  $("#msg").textContent = why;
}
$("#gpsBtn").onclick = () => {
  if (watch != null) { navigator.geolocation.clearWatch(watch); watch = null; $("#gpsBtn").textContent = "GPS starten"; $("#gpsBtn").classList.remove("on"); return; }
  if (!("geolocation" in navigator)) { $("#msg").textContent = "Dieses Gerät kann keinen Standort liefern."; return; }
  $("#msg").textContent = "Suche Satelliten …";
  watch = navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  $("#gpsBtn").textContent = "GPS stoppen"; $("#gpsBtn").classList.add("on");
  setFollow(true);
};
// long press on the distance: clear the trail
let pressT = null;
$("#fDist").parentElement.addEventListener("pointerdown", () => { pressT = setTimeout(() => { if (confirm("Strecke löschen?")) { trail = []; try { localStorage.removeItem(TRAIL_KEY); } catch (e) {} drawTrail(); $("#fDist").textContent = "0 km"; } }, 800); });
$("#fDist").parentElement.addEventListener("pointerup", () => clearTimeout(pressT));
</script>
