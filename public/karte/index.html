<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a86d1">
<title>Rhodos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Caveat:wght@600&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --sea: #2a86d1;
  --sea-deep: #1f6fb3;
  --shallow: #7cc6ee;
  --land: #e9c886;
  --land-dark: #c99a4c;
  --ink: #3b2412;
  --red: #c8321e;
  --paper: #fbf3e2;
  --gps: #0a5cff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--sea-deep); color: var(--ink); font: 15px/1.4 "Figtree", system-ui, sans-serif; }
body { display: flex; flex-direction: column; }
header {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px) 16px;
  padding-top: max(10px, env(safe-area-inset-top)); background: var(--sea-deep); color: #fff;
}
header a { color: #fff; text-decoration: none; font-size: 26px; line-height: 1; padding: 2px 6px 4px 0; }
header h1 { margin: 0; font: 400 20px "Alfa Slab One", Georgia, serif; letter-spacing: 0.04em; }
header small { margin-left: auto; opacity: 0.8; font-size: 12px; }
#wrap { position: relative; flex: 1; overflow: hidden; touch-action: none; background: var(--sea); }
svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.place text { font: 700 1.45px "Figtree", sans-serif; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 0.45px; stroke-linejoin: round; }
.place.big text { font-size: 1.9px; }
.zoombar { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; }
.zoombar button, .locate {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink);
  font: 700 22px "Figtree", sans-serif; box-shadow: 0 3px 10px rgba(0,0,0,0.3); cursor: pointer;
}
.locate.on { background: var(--gps); color: #fff; }
#panel {
  background: var(--paper); padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px; box-shadow: 0 -4px 16px rgba(0,0,0,0.25);
}
#panel .row { display: flex; gap: 10px; align-items: center; }
#gpsBtn {
  flex: 1; border: 0; border-radius: 14px; padding: 13px 16px; font: 700 16px "Figtree", sans-serif;
  background: var(--red); color: #fff; cursor: pointer;
}
#gpsBtn.on { background: var(--ink); }
#where { font: 400 17px "Alfa Slab One", Georgia, serif; }
#facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; font-size: 13px; }
#facts b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
#facts span { color: #7a5a3a; }
#msg { font-size: 13px; color: #7a5a3a; margin: 0; }
.pcb { font-size: 20px; width: auto; min-width: 44px; padding: 0 10px; border-radius: 22px; }
#pcPop {
  position: fixed; left: 50%; top: 22%; width: min(330px, 86vw); background: #fffaf0; border-radius: 6px; padding: 8px 8px 10px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.45); z-index: 30; cursor: pointer; transform: translateX(-50%) rotate(-4deg);
}
#pcPop img { width: 100%; display: block; border-radius: 3px; }
#pcPop div { display: flex; flex-direction: column; padding: 8px 4px 0; }
#pcPop b { font: 400 20px "Alfa Slab One", Georgia, serif; }
#pcPop small { color: #7a5a3a; }
#pcPop #pcLater { position: absolute; top: -12px; right: -12px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; font-size: 20px; }
#pcPop.in { animation: pop 0.9s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes pop { 0% { transform: translate(-50%, -120vh) rotate(30deg) scale(0.6); } 70% { transform: translate(-50%, 8px) rotate(-8deg) scale(1.04); } 100% { transform: translateX(-50%) rotate(-4deg); } }
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--paper); overflow-y: auto; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.sheetHead { display: flex; align-items: center; }
.sheetHead h2 { margin: 0; font: 400 22px "Alfa Slab One", Georgia, serif; flex: 1; }
.sheetHead button, #pcAddText, #pcShare { border: 0; border-radius: 12px; padding: 10px 14px; font: 700 15px "Figtree", sans-serif; background: var(--ink); color: #fff; cursor: pointer; }
#pcShare { background: var(--red); padding: 14px; font-size: 17px; }
.note { margin: 0; color: #7a5a3a; font-size: 13px; }
#pcList { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pcThumb { border: 0; padding: 6px; background: #fff; border-radius: 6px; box-shadow: 0 3px 10px rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 4px; font: 700 14px "Figtree", sans-serif; color: var(--ink); cursor: pointer; text-align: left; }
.pcThumb img { width: 100%; border-radius: 3px; }
.pcThumb.locked { background: #efe6d4; box-shadow: none; aspect-ratio: 3/2.35; justify-content: center; align-items: center; color: #a08a6a; cursor: default; }
.pcThumb small { font-weight: 400; }
#pcCard {
  position: relative; width: 100%; aspect-ratio: 3/2; background-size: cover; border: 9px solid #fffaf0; border-radius: 4px;
  box-shadow: 0 8px 22px rgba(0,0,0,0.3); overflow: hidden; touch-action: none; container-type: inline-size;
}
#pcTitle { position: absolute; left: 4%; top: 5%; font: 400 6cqw "Alfa Slab One", Georgia, serif; color: var(--ink); paint-order: stroke; -webkit-text-stroke: 0.8cqw #fffaf0; pointer-events: none; }
#pcCard .it { position: absolute; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; white-space: nowrap; line-height: 1; }
#pcCard .it.sel { outline: 2px dashed var(--red); outline-offset: 4px; border-radius: 4px; }
#pcCard .e { font-size: 10cqw; }
#pcCard .t { font: 600 7.6cqw/1.05 "Caveat", cursive; text-align: center; display: block; paint-order: stroke; -webkit-text-stroke: 1.2cqw rgba(255,250,240,0.85); }
#pcCard .st { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 21cqw; height: 21cqw; border-radius: 50%; border: 0.8cqw double #a3341f; color: #a3341f; font: 700 3.3cqw "Figtree", sans-serif; }
#pcCard .st i { font: 400 2.8cqw "Figtree", sans-serif; }
#pcCard .bn { display: inline-block; padding: 1.4cqw 4cqw; background: #f3e3bd; border: 0.4cqw solid #a0672c; font: 400 5.6cqw "Alfa Slab One", Georgia, serif; color: var(--ink); clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); }
#pcCard .hr { display: inline-block; padding: 1.6cqw 4cqw; background: #c8321e; color: #fff; border-radius: 6cqw; font: 700 6.5cqw "Figtree", sans-serif; }
#pcTools { display: flex; gap: 8px; justify-content: center; }
#pcTools button { width: 48px; height: 40px; border-radius: 10px; border: 1px solid #e2d6c2; background: #fff; font-size: 20px; cursor: pointer; }
.pcRow { display: flex; gap: 8px; }
.pcRow textarea { flex: 1; font: 600 20px "Caveat", cursive; border: 1px solid #e2d6c2; border-radius: 10px; padding: 6px 10px; background: #fff; resize: none; }
.pcInk { display: flex; gap: 8px; }
.pcInk button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #d8cbb3; cursor: pointer; }
.pcInk button[aria-pressed=true] { box-shadow: 0 0 0 3px var(--red); }
.pcScroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.pcScroll button { flex: 0 0 auto; font-size: 28px; background: #fff; border: 1px solid #e2d6c2; border-radius: 10px; padding: 4px 8px; cursor: pointer; }
.pcScroll.stick button { font: 700 14px "Figtree", sans-serif; padding: 10px 12px; color: var(--ink); }
@keyframes pulse { 0% { r: 0.8; opacity: 0.7; } 100% { r: 3; opacity: 0; } }
#me .ring { animation: pulse 1.8s ease-out infinite; }
</style>
</head>
<body>
<header>
  <a href="/" aria-label="Zurück">‹</a>
  <h1>Rhodos</h1>
  <small id="ver">Karte v2</small>
</header>
<div id="wrap">
  <svg id="map" viewBox="0 0 70 78" aria-label="Karte von Rhodos">
    <defs>
      <pattern id="waves" width="6" height="3" patternUnits="userSpaceOnUse">
        <path d="M0 2 q1.5 -1.2 3 0 t3 0" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="0.18"/>
      </pattern>
      <radialGradient id="landShade" cx="50%" cy="45%" r="60%">
        <stop offset="0" stop-color="#d9a95c"/>
        <stop offset="0.55" stop-color="#e6c07a"/>
        <stop offset="1" stop-color="#f0d49a"/>
      </radialGradient>
      <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="0.6"/></filter>
    </defs>
    <g id="world">
      <rect x="-200" y="-200" width="470" height="478" fill="var(--sea)"/>
      <rect x="-200" y="-200" width="470" height="478" fill="url(#waves)"/>
      <g id="shallow" fill="none" stroke="var(--shallow)" stroke-width="2.6" stroke-linejoin="round" filter="url(#soft)" opacity="0.85"></g>
      <g id="land" stroke="var(--land-dark)" stroke-width="0.25" stroke-linejoin="round"></g>
      <g id="relief"></g>
      <g id="deco"></g>
      <g id="places"></g>
      <polyline id="trail" fill="none" stroke="var(--gps)" stroke-width="0.35" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>
      <circle id="acc" r="1" fill="var(--gps)" fill-opacity="0.15" stroke="var(--gps)" stroke-opacity="0.4" stroke-width="0.1" vector-effect="non-scaling-stroke" hidden/>
      <g id="meAt"><g id="me" hidden>
        <circle class="ring" r="0.8" fill="none" stroke="var(--gps)" stroke-width="0.3"/>
        <path class="head" d="M0 -2.3 L0.75 -0.9 L-0.75 -0.9 Z" fill="var(--gps)" hidden/>
        <circle r="0.85" fill="var(--gps)" stroke="#fff" stroke-width="0.28"/>
      </g></g>
    </g>
  </svg>
  <div class="zoombar">
    <button type="button" id="zin" aria-label="Näher">+</button>
    <button type="button" id="zout" aria-label="Weiter weg">−</button>
    <button type="button" class="locate" id="follow" aria-label="Mir folgen">◎</button>
    <button type="button" class="locate pcb" id="pcBtn" aria-label="Postkarten">✉</button>
  </div>
</div>
<div id="pcPop" hidden>
  <img alt="">
  <div><b></b><small>Tippen zum Schnappen</small></div>
  <button type="button" id="pcLater" aria-label="Später">×</button>
</div>
<div id="pcAll" class="sheet" hidden>
  <div class="sheetHead"><h2>Postkarten</h2><button type="button" id="pcAllClose">Fertig</button></div>
  <p class="note">Erreichst du einen dieser Orte, poppt seine Postkarte auf.</p>
  <div id="pcList"></div>
</div>
<div id="pcEd" class="sheet" hidden>
  <div class="sheetHead"><h2>Postkarte</h2><button type="button" id="pcClose">Fertig</button></div>
  <div id="pcCard"><div id="pcTitle"></div></div>
  <div id="pcTools" hidden><button type="button" id="pcSmaller">−</button><button type="button" id="pcBigger">+</button><button type="button" id="pcTurn">⟳</button><button type="button" id="pcDel">🗑</button></div>
  <div class="pcRow"><textarea id="pcText" rows="2" placeholder="Liebe Grüße …"></textarea><button type="button" id="pcAddText">Text</button></div>
  <div class="pcInk" id="pcInk"></div>
  <div class="pcScroll" id="pcEmoji"></div>
  <div class="pcScroll stick" id="pcStick"></div>
  <button type="button" id="pcShare">Teilen</button>
</div>
<section id="panel">
  <div class="row">
    <div style="flex:1"><div id="where">Wo bist du?</div><p id="msg">Tippe auf „GPS starten“. Die Karte bleibt auf dem Handy, nur die Position kommt vom GPS.</p></div>
  </div>
  <div id="facts" hidden>
    <div><span>Breite</span><b id="fLat">–</b></div>
    <div><span>Länge</span><b id="fLon">–</b></div>
    <div><span>Genauigkeit</span><b id="fAcc">–</b></div>
    <div><span>Höhe</span><b id="fAlt">–</b></div>
    <div><span>Tempo</span><b id="fSpd">–</b></div>
    <div><span>Strecke</span><b id="fDist">–</b></div>
  </div>
  <div class="row">
    <button type="button" id="gpsBtn">GPS starten</button>
  </div>
</section>

// Projection: kilometres east and south of 27.55 E / 36.52 N, with the longitude shrunk at this latitude.
const LON0 = 27.55, LAT0 = 36.52, KM = 111.32, KX = Math.cos(36.17 * Math.PI / 180);
const P = (lon, lat) => [(lon - LON0) * KM * KX, (LAT0 - lat) * KM];

// A smooth, hand-drawn looking outline through the coast points (Catmull-Rom as Bézier).
function smooth(pts, closed) {
  const q = pts.map(([lon, lat]) => P(lon, lat));
  const n = q.length, at = (i) => q[closed ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];
  let d = `M${q[0][0].toFixed(2)} ${q[0][1].toFixed(2)}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(2)} ${c1[1].toFixed(2)} ${c2[0].toFixed(2)} ${c2[1].toFixed(2)} ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
  }
  return d + (closed ? "Z" : "");
}

/* ---------------- Pan and zoom (one finger drags, two pinch, buttons) ---------------- */
const svg = $("#map"), wrap = $("#wrap");
let vb = { x: 6, y: 4, w: 62, h: 70 };      // the island with a little sea around it
const ME = { x: 0, y: 0 };
function fitVB() {
  const r = wrap.getBoundingClientRect(), ar = r.width / r.height;
  if (vb.w / vb.h > ar) { const h = vb.w / ar; vb.y -= (h - vb.h) / 2; vb.h = h; } else { const w = vb.h * ar; vb.x -= (w - vb.w) / 2; vb.w = w; }
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  placeMarks();
}
// marks are drawn for a 60 km wide view; zoomed in they shrink back to their size on screen
function placeMarks() {
  const k = Math.min(1.4, vb.w / 60);
  for (const [g, x, y] of MARKS) g.setAttribute("transform", `translate(${x} ${y}) scale(${k})`);
  $("#meAt").setAttribute("transform", `translate(${ME.x} ${ME.y}) scale(${Math.max(0.6, Math.min(1.4, vb.w / 30))})`);
}
function zoomAt(f, cx, cy) {
  const nw = Math.min(160, Math.max(3, vb.w / f)), k = nw / vb.w;
  vb.x = cx - (cx - vb.x) * k; vb.y = cy - (cy - vb.y) * k; vb.w = nw; vb.h *= k; fitVB();
}
const toMap = (px, py) => { const r = svg.getBoundingClientRect(); return [vb.x + (px - r.left) / r.width * vb.w, vb.y + (py - r.top) / r.height * vb.h]; };
const ptrs = new Map(); let last = null;
wrap.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; wrap.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); last = null; });
wrap.addEventListener("pointermove", (e) => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) {
    const r = svg.getBoundingClientRect();
    vb.x -= (e.clientX - prev[0]) / r.width * vb.w; vb.y -= (e.clientY - prev[1]) / r.height * vb.h; fitVB(); setFollow(false);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (last) { const [cx, cy] = toMap((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); zoomAt(d / last, cx, cy); }
    last = d;
  }
});
for (const n of ["pointerup", "pointercancel"]) wrap.addEventListener(n, (e) => { ptrs.delete(e.pointerId); last = null; });
wrap.addEventListener("wheel", (e) => { e.preventDefault(); const [cx, cy] = toMap(e.clientX, e.clientY); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, cx, cy); }, { passive: false });
$("#zin").onclick = () => zoomAt(1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
$("#zout").onclick = () => zoomAt(1 / 1.5, vb.x + vb.w / 2, vb.y + vb.h / 2);
window.addEventListener("resize", fitVB);
fitVB();

/* ---------------- GPS ---------------- */
const TRAIL_KEY = "rhodos-spur";
let watch = null, follow = false, fix = null, trail = [];
try { trail = JSON.parse(localStorage.getItem(TRAIL_KEY) || "[]"); } catch (e) {}
const distKm = (a, b) => { const R = 6371, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
function drawTrail() { $("#trail").setAttribute("points", trail.map(([lat, lon]) => P(lon, lat).map((v) => v.toFixed(3)).join(",")).join(" ")); }
function trailKm() { let s = 0; for (let i = 1; i < trail.length; i++) s += distKm(trail[i - 1], trail[i]); return s; }
drawTrail();
function setFollow(on) { follow = on; $("#follow").classList.toggle("on", on); if (on && fix) centre(); }
function centre() { const [x, y] = P(fix.lon, fix.lat); if (vb.w > 30) { vb.w = 24; vb.h = 24; } vb.x = x - vb.w / 2; vb.y = y - vb.h / 2; fitVB(); }
$("#follow").onclick = () => setFollow(!follow);
function nearest(lat, lon) {
  let best = null;
  for (const [name, plat, plon] of PLACES) { const d = distKm([lat, lon], [plat, plon]); if (!best || d < best.d) best = { name, d, plat, plon }; }
  return best;
}
const bearing = (a, b) => { const r = Math.PI / 180, y = Math.sin((b[1] - a[1]) * r) * Math.cos(b[0] * r), x = Math.cos(a[0] * r) * Math.sin(b[0] * r) - Math.sin(a[0] * r) * Math.cos(b[0] * r) * Math.cos((b[1] - a[1]) * r);
  return ["N", "NO", "O", "SO", "S", "SW", "W", "NW"][Math.round(((Math.atan2(y, x) / r + 360) % 360) / 45) % 8]; };
const fmt = (v, d) => v.toFixed(d).replace(".", ",");
function onFix(p) {
  const c = p.coords;
  fix = { lat: c.latitude, lon: c.longitude, acc: c.accuracy, alt: c.altitude, spd: c.speed, head: c.heading, t: p.timestamp };
  const [x, y] = P(fix.lon, fix.lat), me = $("#me");
  me.removeAttribute("hidden"); ME.x = x; ME.y = y; placeMarks();
  const acc = $("#acc"); acc.removeAttribute("hidden"); acc.setAttribute("cx", x); acc.setAttribute("cy", y); acc.setAttribute("r", Math.max(0.01, fix.acc / 1000));
  const head = me.querySelector(".head");
  if (fix.head != null && !isNaN(fix.head) && fix.spd > 0.7) { head.removeAttribute("hidden"); head.setAttribute("transform", `rotate(${fix.head})`); } else head.setAttribute("hidden", "");
  // keep a trail of good fixes, one every 15 m
  if (fix.acc < 60) {
    const lastP = trail[trail.length - 1];
    if (!lastP || distKm(lastP, [fix.lat, fix.lon]) > 0.015) { trail.push([+fix.lat.toFixed(6), +fix.lon.toFixed(6)]); if (trail.length > 5000) trail.shift(); try { localStorage.setItem(TRAIL_KEY, JSON.stringify(trail)); } catch (e) {} drawTrail(); }
  }
  $("#facts").hidden = false;
  $("#fLat").textContent = fmt(fix.lat, 5) + "°"; $("#fLon").textContent = fmt(fix.lon, 5) + "°";
  $("#fAcc").textContent = "± " + Math.round(fix.acc) + " m";
  $("#fAlt").textContent = fix.alt != null ? Math.round(fix.alt) + " m" : "–";
  $("#fSpd").textContent = fix.spd != null ? fmt(fix.spd * 3.6, 1) + " km/h" : "–";
  $("#fDist").textContent = fmt(trailKm(), 2) + " km";
  const n = nearest(fix.lat, fix.lon);
  const onIsland = fix.lat > 35.85 && fix.lat < 36.48 && fix.lon > 27.66 && fix.lon < 28.26;
  if (onIsland) {
    $("#where").textContent = n.d < 1 ? "In " + n.name : n.name + ", " + fmt(n.d, 1) + " km " + bearing([n.plat, n.plon], [fix.lat, fix.lon]);
    $("#msg").textContent = "GPS läuft. Die Ortspunkte auf der Karte sind ungefähr, dein Punkt ist echt.";
  } else {
    const d = distKm([fix.lat, fix.lon], [36.434, 28.217]);
    $("#where").textContent = "Nicht auf Rhodos";
    $("#msg").textContent = "Du bist " + fmt(d, d < 100 ? 1 : 0) + " km von Rhodos-Stadt entfernt. Der Punkt erscheint, sobald du im Kartenbereich bist.";
  }
  if (follow) centre();
  postcardCheck(fix);
}
function onErr(e) {
  const why = { 1: "Standort nicht erlaubt. Bitte in den Browser-Einstellungen für diese Seite erlauben.", 2: "Kein GPS-Signal. Am besten draußen, mit freiem Himmel.", 3: "GPS antwortet nicht, ich versuche es weiter." }[e.code] || e.message;
  $("#msg").textContent = why;
}
$("#gpsBtn").onclick = () => {
  if (watch != null) { navigator.geolocation.clearWatch(watch); watch = null; $("#gpsBtn").textContent = "GPS starten"; $("#gpsBtn").classList.remove("on"); return; }
  if (!("geolocation" in navigator)) { $("#msg").textContent = "Dieses Gerät kann keinen Standort liefern."; return; }
  $("#msg").textContent = "Suche Satelliten …";
  watch = navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
  $("#gpsBtn").textContent = "GPS stoppen"; $("#gpsBtn").classList.add("on");
  setFollow(true);
};

const PC_KEY = "rhodos-postkarten";
let PC = {};
try { PC = JSON.parse(localStorage.getItem(PC_KEY) || "{}"); } catch (e) {}

function pcBadge() { $("#pcBtn").textContent = "✉" + (pcCount() ? " " + pcCount() : ""); }

// where you are: a spot reached for the first time pops its card
function postcardCheck(f) {
  for (const s of SPOTS) {
    if (PC[s.id] || popping === s.id) continue;
    if (distKm([f.lat, f.lon], [s.lat, s.lon]) <= s.r && f.acc < 300) { popCard(s); break; }
  }
}
let popping = null;
function popCard(s) {
  popping = s.id;
  const pop = $("#pcPop");
  pop.querySelector("img").src = sceneURL(s.id);
  pop.querySelector("b").textContent = "Grüße aus " + s.name;
  pop.hidden = false; pop.classList.remove("in"); void pop.offsetWidth; pop.classList.add("in");
  if (navigator.vibrate) try { navigator.vibrate([40, 60, 40]); } catch (e) {}
  pop.onclick = () => { snap(s); };
}
function snap(s) {
  $("#pcPop").hidden = true; popping = null;
  if (!PC[s.id]) { PC[s.id] = { at: new Date().toISOString(), items: [stampItem(s)] }; pcSave(); pcBadge(); }
  openEditor(s.id);
}

  $("#pcCard").style.backgroundImage = `url("${sceneURL(id)}")`;
  $("#pcTitle").textContent = "Grüße aus " + s.name;
  $("#pcEmoji").innerHTML = EMOJI.map((e) => `<button type="button" data-e="${e}">${e}</button>`).join("");
  $("#pcEmoji").querySelectorAll("button").forEach((b) => b.onclick = () => addItem({ k: "emoji", t: b.dataset.e, x: 30 + Math.random() * 40, y: 40 + Math.random() * 30, s: 1, r: 0 }));
  $("#pcStick").innerHTML = STICKERS.map(([v, t]) => `<button type="button" data-v="${v}">${t}</button>`).join("");
  $("#pcStick").querySelectorAll("button").forEach((b) => b.onclick = () => {
    const v = b.dataset.v;
    if (v === "stamp") addItem(stampItem(s));
    else if (v === "heart") addItem({ k: "heart", t: "Rhodos", x: 50, y: 50, s: 1, r: -6 });
    else addItem({ k: "banner", t: v.slice(7), x: 50, y: 34, s: 1, r: -4 });
  });
  $("#pcInk").innerHTML = INK.map((c, i) => `<button type="button" data-i="${i}" style="background:${c}" aria-pressed="${i === 0}"></button>`).join("");
  $("#pcInk").querySelectorAll("button").forEach((b) => b.onclick = () => {
    ED.ink = INK[+b.dataset.i];
    $("#pcInk").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    const it = PC[ED.id].items[ED.sel]; if (it && it.k === "text") { it.c = ED.ink; pcSave(); drawItems(); }
  });
  $("#pcText").value = "";
  drawItems();
}
function addItem(it) { const l = PC[ED.id].items; l.push(it); ED.sel = l.length - 1; pcSave(); drawItems(); }
$("#pcAddText").onclick = () => {
  const t = $("#pcText").value.trim(); if (!t) return $("#pcText").focus();
  addItem({ k: "text", t, x: 35, y: 70, s: 1, r: -3, c: ED.ink }); $("#pcText").value = "";
};
function itemHTML(it) {
  if (it.k === "emoji") return `<span class="e">${it.t}</span>`;
  if (it.k === "text") return `<span class="t" style="color:${it.c}">${it.t.replace(/[<>&]/g, "").replace(/\n/g, "<br>")}</span>`;
  if (it.k === "stamp") return `<span class="st"><b>${it.t}</b><i>${it.d}</i></span>`;
  if (it.k === "banner") return `<span class="bn">${it.t}</span>`;
  if (it.k === "heart") return `<span class="hr">♥ ${it.t}</span>`;
  return "";
}
function drawItems() {
  const card = $("#pcCard"); card.querySelectorAll(".it").forEach((e) => e.remove());
  PC[ED.id].items.forEach((it, i) => {
    const d = document.createElement("div"); d.className = "it" + (i === ED.sel ? " sel" : "");
    d.style.left = it.x + "%"; d.style.top = it.y + "%";
    d.style.transform = `translate(-50%, -50%) rotate(${it.r}deg) scale(${it.s})`;
    d.innerHTML = itemHTML(it);
    let st = null;
    d.addEventListener("pointerdown", (e) => { e.stopPropagation(); ED.sel = i; card.querySelectorAll(".it").forEach((x) => x.classList.remove("sel")); d.classList.add("sel"); d.setPointerCapture(e.pointerId); st = [e.clientX, e.clientY, it.x, it.y]; $("#pcTools").hidden = false; });
    d.addEventListener("pointermove", (e) => {
      if (!st) return; const r = card.getBoundingClientRect();
      it.x = clamp(st[2] + (e.clientX - st[0]) / r.width * 100, 0, 100); it.y = clamp(st[3] + (e.clientY - st[1]) / r.height * 100, 0, 100);
      d.style.left = it.x + "%"; d.style.top = it.y + "%";
    });
    d.addEventListener("pointerup", () => { st = null; pcSave(); });
    card.append(d);
  });
  $("#pcTools").hidden = ED.sel < 0 || !PC[ED.id].items[ED.sel];
}
$("#pcCard").addEventListener("pointerdown", () => { ED.sel = -1; drawItems(); });
const selIt = () => PC[ED.id].items[ED.sel];
$("#pcBigger").onclick = () => { const it = selIt(); if (it) { it.s = Math.min(4, it.s * 1.2); pcSave(); drawItems(); } };
$("#pcSmaller").onclick = () => { const it = selIt(); if (it) { it.s = Math.max(0.3, it.s / 1.2); pcSave(); drawItems(); } };
$("#pcTurn").onclick = () => { const it = selIt(); if (it) { it.r = (it.r + 15) % 360; pcSave(); drawItems(); } };
$("#pcDel").onclick = () => { if (selIt()) { PC[ED.id].items.splice(ED.sel, 1); ED.sel = -1; pcSave(); drawItems(); } };
$("#pcClose").onclick = () => { $("#pcEd").hidden = true; ED = null; };

/* the picture to share: the scene, the title, and every item, drawn the same way on a canvas */
async function renderCard() {
  const W = 1500, H = 1000, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const c = cv.getContext("2d");
  const img = new Image(); img.src = sceneURL(ED.id); await img.decode();
  c.drawImage(img, 0, 0, W, H);
  try { await document.fonts.ready; } catch (e) {}
  // white border like a printed card
  c.strokeStyle = "#fffaf0"; c.lineWidth = 36; c.strokeRect(0, 0, W, H);
  c.font = "90px 'Alfa Slab One', Georgia, serif"; c.textBaseline = "top"; c.lineJoin = "round";
  c.lineWidth = 12; c.strokeStyle = "#fffaf0"; c.strokeText($("#pcTitle").textContent, 60, 54);
  c.fillStyle = "#3b2412"; c.fillText($("#pcTitle").textContent, 60, 54);
  const u = W / 100;   // 1 % of the card width, the unit the card on screen uses (cqw)
  for (const it of PC[ED.id].items) {
    c.save(); c.translate(it.x / 100 * W, it.y / 100 * H); c.rotate(it.r * Math.PI / 180); c.scale(it.s, it.s);
    c.textAlign = "center"; c.textBaseline = "middle";
    if (it.k === "emoji") { c.font = `${10 * u}px system-ui, 'Apple Color Emoji', 'Noto Color Emoji', sans-serif`; c.fillText(it.t, 0, 0); }
    else if (it.k === "text") {
      c.font = `600 ${7.6 * u}px 'Caveat', cursive`; const lines = it.t.split("\n");
      lines.forEach((l, i) => { const y = (i - (lines.length - 1) / 2) * 8 * u; c.lineWidth = 1.6 * u; c.lineJoin = "round"; c.strokeStyle = it.c === "#ffffff" ? "rgba(0,0,0,0.35)" : "rgba(255,250,240,0.85)"; c.strokeText(l, 0, y); c.fillStyle = it.c; c.fillText(l, 0, y); });
    } else if (it.k === "stamp") {
      c.strokeStyle = "#a3341f"; c.fillStyle = "#a3341f"; c.lineWidth = 0.4 * u;
      c.beginPath(); c.arc(0, 0, 10.5 * u, 0, Math.PI * 2); c.stroke(); c.beginPath(); c.arc(0, 0, 9.4 * u, 0, Math.PI * 2); c.stroke();
      c.font = `700 ${3.3 * u}px 'Figtree', sans-serif`; c.fillText(it.t, 0, -1.6 * u); c.font = `400 ${2.8 * u}px 'Figtree', sans-serif`; c.fillText(it.d, 0, 2.4 * u);
    } else if (it.k === "banner") {
      c.font = `${5.6 * u}px 'Alfa Slab One', Georgia, serif`; const w = c.measureText(it.t).width + 8 * u, h = 4.2 * u;
      c.fillStyle = "#f3e3bd"; c.strokeStyle = "#a0672c"; c.lineWidth = 0.4 * u;
      c.beginPath(); c.moveTo(-w / 2, -h); c.lineTo(w / 2, -h); c.lineTo(w / 2 - 0.04 * w, 0); c.lineTo(w / 2, h); c.lineTo(-w / 2, h); c.lineTo(-w / 2 + 0.04 * w, 0); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = "#3b2412"; c.fillText(it.t, 0, 0.2 * u);
    } else if (it.k === "heart") {
      c.font = `700 ${6.5 * u}px 'Figtree', sans-serif`; const w = c.measureText("♥ " + it.t).width + 8 * u, h = 5 * u;
      c.fillStyle = "#c8321e"; c.beginPath(); if (c.roundRect) c.roundRect(-w / 2, -h, w, 2 * h, h); else c.rect(-w / 2, -h, w, 2 * h); c.fill();
      c.fillStyle = "#fff"; c.fillText("♥ " + it.t, 0, 0.2 * u);
    }
    c.restore();
  }
  return new Promise((res) => cv.toBlob(res, "image/jpeg", 0.9));
}
$("#pcShare").onclick = async () => {
  const blob = await renderCard(), name = "postkarte-" + ED.id + ".jpg";
  const file = new File([blob], name, { type: "image/jpeg" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: $("#pcTitle").textContent, text: $("#pcTitle").textContent }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
};
pcBadge();
// for trying it out at home: karte/?postkarte=lindos
const testId = new URLSearchParams(location.search).get("postkarte");
if (testId && SPOTS.find((s) => s.id === testId)) setTimeout(() => popCard(SPOTS.find((s) => s.id === testId)), 800);
</script>
